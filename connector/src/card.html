<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Skillshelf</title>
<style>
/* Skillshelf card, shown inside Claude chats (MCP Apps). The host's own colours and fonts are used when it sends them. */
:root {
  --bg: var(--color-background-primary, #ffffff);
  --bg2: var(--color-background-secondary, #f6f5f2);
  --fg: var(--color-text-primary, #1d1c1a);
  --fg2: var(--color-text-secondary, #5f5d58);
  --line: var(--color-border-tertiary, #e6e3dc);
  --ok-bg: var(--color-background-success, #e7f4ea); --ok: var(--color-text-success, #1f6b35);
  --note-bg: var(--color-background-warning, #fbf1dc); --note: var(--color-text-warning, #8a5a00);
  --risk-bg: var(--color-background-danger, #fbe6e4); --risk: var(--color-text-danger, #a3261c);
  --info: var(--color-text-info, #2d5bd1);
  --radius: var(--border-radius-lg, 12px);
  --font: var(--font-sans, ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif);
  --mono: var(--font-mono, ui-monospace, SFMono-Regular, Menlo, Consolas, monospace);
}
:root[data-theme="dark"] {
  --bg: var(--color-background-primary, #1f1e1c);
  --bg2: var(--color-background-secondary, #2a2926);
  --fg: var(--color-text-primary, #f2f0ea);
  --fg2: var(--color-text-secondary, #b4b0a6);
  --line: var(--color-border-tertiary, #3a3833);
  --ok-bg: var(--color-background-success, #17301e); --ok: var(--color-text-success, #8fd6a3);
  --note-bg: var(--color-background-warning, #35290f); --note: var(--color-text-warning, #f0c46a);
  --risk-bg: var(--color-background-danger, #3a1916); --risk: var(--color-text-danger, #f29a90);
  --info: var(--color-text-info, #8fb0ff);
}
* { box-sizing: border-box; }
html, body { margin: 0; background: transparent; }
body { font: 14px/1.45 var(--font); color: var(--fg); padding: 2px; -webkit-font-smoothing: antialiased; }
button { font: inherit; color: inherit; cursor: pointer; }
.head { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; margin: 2px 2px 8px; color: var(--fg2); font-size: 12.5px; }
.head b { color: var(--fg); font-weight: 600; }
.list { display: grid; gap: 8px; }
.card { background: var(--bg); border: 1px solid var(--line); border-radius: var(--radius); padding: 12px 14px; }
.top { display: flex; gap: 10px; align-items: flex-start; justify-content: space-between; }
h3 { margin: 0; font-size: 15px; font-weight: 600; letter-spacing: -0.01em; }
.meta { color: var(--fg2); font-size: 12.5px; margin-top: 1px; }
.what { margin: 6px 0 0; }
.badge { flex: none; display: inline-flex; align-items: center; gap: 5px; font-size: 12px; font-weight: 600; padding: 3px 8px; border-radius: 999px; white-space: nowrap; }
.badge::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: currentColor; }
.ok { background: var(--ok-bg); color: var(--ok); }
.note { background: var(--note-bg); color: var(--note); }
.risk { background: var(--risk-bg); color: var(--risk); }
.actions { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
.btn { border: 1px solid var(--line); background: var(--bg2); border-radius: 8px; padding: 5px 10px; font-size: 13px; font-weight: 500; }
.btn:hover { border-color: var(--fg2); }
.btn[aria-expanded="true"] { background: var(--fg); color: var(--bg); border-color: var(--fg); }
.btn.link { background: none; border-color: transparent; color: var(--info); padding-left: 4px; padding-right: 4px; }
.btn.primary { background: var(--fg); color: var(--bg); border-color: var(--fg); }
.btn:disabled { opacity: .45; cursor: default; }
.btn:focus-visible, .chip:focus-visible { outline: 2px solid var(--info); outline-offset: 2px; }
.drawer { margin-top: 10px; border-top: 1px solid var(--line); padding-top: 10px; display: grid; gap: 8px; }
.drawer:empty { display: none; }
.drawer > *, .drawer > div > * { min-width: 0; }
.lbl { font-size: 12px; color: var(--fg2); font-weight: 600; margin-bottom: 3px; }
.cmd { display: flex; gap: 6px; align-items: stretch; }
.cmd code { flex: 1; min-width: 0; font: 12.5px/1.4 var(--mono); background: var(--bg2); border: 1px solid var(--line); border-radius: 8px; padding: 6px 8px; overflow-x: auto; white-space: nowrap; }
.cmd .btn { flex: none; }
.row { padding: 8px 10px; border-radius: 8px; }
.row b { display: block; font-weight: 600; }
.row span { color: inherit; opacity: .9; font-size: 13px; }
ul.plain { margin: 0; padding-left: 18px; }
ul.plain li { margin: 2px 0; }
ol.steps { margin: 0; padding-left: 20px; }
ol.steps li { margin: 4px 0; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { border: 1px solid var(--line); background: var(--bg); border-radius: 999px; padding: 5px 11px; font-size: 13px; }
.chip[aria-pressed="true"] { background: var(--fg); color: var(--bg); border-color: var(--fg); }
.small { font-size: 12.5px; color: var(--fg2); }
.done { font-weight: 600; }
.foot { margin: 8px 2px 0; font-size: 12px; color: var(--fg2); }
.loading { color: var(--fg2); padding: 10px 4px; }
/* Skills panel */
.panel { background: var(--bg); border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden; }
.tabs { display: flex; gap: 4px; padding: 8px 10px; border-bottom: 1px solid var(--line); align-items: center; }
.tab { border: 0; background: none; border-radius: 8px; padding: 5px 10px; font-size: 13.5px; font-weight: 600; color: var(--fg2); }
.tab[aria-selected="true"] { background: var(--bg2); color: var(--fg); }
.tabs .brand { margin-left: auto; font-size: 12px; color: var(--fg2); padding-right: 4px; }
.tabs .pin { border: 1px solid var(--line); background: none; border-radius: 8px; padding: 4px 9px; font-size: 12.5px; color: var(--fg); white-space: nowrap; }
.srow { display: flex; align-items: center; gap: 10px; padding: 9px 14px; border-top: 1px solid var(--line); }
.srow:first-child { border-top: 0; }
.srow.off .sname, .srow.off .sdesc { opacity: .5; }
.smain { flex: 1; min-width: 0; text-align: left; background: none; border: 0; padding: 0; }
.sname { font-weight: 600; display: flex; align-items: center; gap: 7px; flex-wrap: wrap; }
.sdesc { color: var(--fg2); font-size: 12.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.srow.open .sdesc { white-space: normal; }
.mini { display: inline-flex; align-items: center; gap: 4px; font-size: 11.5px; font-weight: 600; padding: 1px 7px; border-radius: 999px; }
.mini::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
.mini.plain { background: var(--bg2); color: var(--fg2); }
.switch { flex: none; width: 42px; height: 24px; border-radius: 999px; border: 0; background: #c9c5bc; position: relative; transition: background .15s; padding: 0; }
:root[data-theme="dark"] .switch { background: #4a4742; }
.switch::after { content: ""; position: absolute; top: 3px; left: 3px; width: 18px; height: 18px; border-radius: 50%; background: #fff; box-shadow: 0 1px 2px rgba(0,0,0,.25); transition: transform .15s; }
.switch[aria-checked="true"] { background: #2f8f4e; }
.switch[aria-checked="true"]::after { transform: translateX(18px); }
.switch:focus-visible, .tab:focus-visible, .smain:focus-visible { outline: 2px solid var(--info); outline-offset: 2px; }
.sopen { padding: 0 14px 12px; display: grid; gap: 8px; }
.pfoot { padding: 10px 14px; border-top: 1px solid var(--line); font-size: 12px; color: var(--fg2); }
.phint { padding: 8px 14px; font-size: 12.5px; color: var(--fg2); background: var(--bg2); border-bottom: 1px solid var(--line); }
.ptoast { padding: 9px 14px; font-size: 13px; font-weight: 500; background: var(--ok-bg); color: var(--ok); border-top: 1px solid var(--line); }
.findbar { display: flex; gap: 6px; padding: 10px 14px; }
.findbar input { flex: 1; min-width: 0; border: 1px solid var(--line); background: var(--bg2); border-radius: 8px; padding: 6px 10px; font: inherit; color: inherit; outline: none; }
.findbar input:focus { border-color: var(--info); }
.pempty { padding: 14px; color: var(--fg2); }
.presults { display: grid; grid-template-columns: minmax(0, 1fr); gap: 8px; padding: 0 10px 10px; }
.presults > * { min-width: 0; }
/* Slop check */
.verdict { display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; padding: 12px 14px; border-bottom: 1px solid var(--line); }
.verdict b { font-size: 15px; }
.lv-high { color: var(--risk); } .lv-some { color: var(--note); } .lv-low, .lv-none { color: var(--ok); }
.quote { padding: 12px 14px; white-space: pre-wrap; line-height: 1.6; max-height: 260px; overflow: auto; border-bottom: 1px solid var(--line); font-size: 13.5px; }
mark { background: var(--note-bg); color: inherit; border-bottom: 2px solid var(--note); border-radius: 3px; padding: 0 1px; }
.tells { padding: 6px 14px 4px; display: grid; gap: 2px; }
.tell { display: flex; gap: 10px; align-items: flex-start; padding: 7px 0; border-top: 1px solid var(--line); cursor: pointer; }
.tell:first-child { border-top: 0; }
.tell input { margin-top: 3px; accent-color: var(--fg); width: 16px; height: 16px; flex: none; }
.tell b { font-weight: 600; }
.tell .ex { color: var(--fg2); font-size: 12.5px; }
.slopacts { display: flex; flex-wrap: wrap; gap: 6px; padding: 10px 14px; border-top: 1px solid var(--line); }
.everywhere { padding: 0 14px 12px; display: grid; gap: 6px; }
@media (max-width: 420px) { .top { flex-direction: column; gap: 6px; } }
</style>
</head>
<body>
<div id="app"><div class="loading">Checking Skillshelf…</div></div>
<script>
(() => {
  // ---------- talking to the host (MCP Apps, JSON-RPC over postMessage) ----------
  let nextId = 0, host = {}, input = {};
  const waiting = {};
  const post = m => window.parent.postMessage(m, '*');
  const request = (method, params) => new Promise((resolve, reject) => {
    const id = ++nextId;
    waiting[id] = { resolve, reject };
    post({ jsonrpc: '2.0', id, method, params });
    setTimeout(() => { if (waiting[id]) { delete waiting[id]; reject(new Error('No answer')); } }, 30000);
  });
  const notify = (method, params) => post({ jsonrpc: '2.0', method, params });

  window.addEventListener('message', e => {
    if (e.source !== window.parent) return;
    const m = e.data;
    if (!m || m.jsonrpc !== '2.0') return;
    if (!m.method && m.id != null) {   // a reply to one of our requests
      const w = waiting[m.id]; if (!w) return; delete waiting[m.id];
      return m.error ? w.reject(new Error(m.error.message || 'Error')) : w.resolve(m.result);
    }
    switch (m.method) {
      case 'ui/notifications/tool-input': input = (m.params && m.params.arguments) || {}; break;
      case 'ui/notifications/tool-result': show(m.params); break;
      case 'ui/notifications/tool-cancelled': app.innerHTML = '<div class="loading">Cancelled.</div>'; break;
      case 'ui/notifications/host-context-changed': applyContext(m.params || {}); break;
      default: if (m.id != null) post(m.method === 'ui/resource-teardown' || m.method === 'ping' ? { jsonrpc: '2.0', id: m.id, result: {} } : { jsonrpc: '2.0', id: m.id, error: { code: -32601, message: 'Method not found' } });
    }
  });

  function applyContext(c) {
    if (c.theme) document.documentElement.dataset.theme = c.theme;
    const vars = c.styles && c.styles.variables;
    if (vars) for (const k in vars) if (vars[k]) document.documentElement.style.setProperty(k, vars[k]);
    const fonts = c.styles && c.styles.css && c.styles.css.fonts;
    if (fonts && !document.getElementById('host-fonts')) { const s = document.createElement('style'); s.id = 'host-fonts'; s.textContent = fonts; document.head.appendChild(s); }
    // Picture-in-picture keeps the panel on screen while the user chats, if the host offers it
    if (Array.isArray(c.availableDisplayModes)) view.modes = c.availableDisplayModes;
    if (c.displayMode) view.mode = c.displayMode;
    if ((c.availableDisplayModes || c.displayMode) && P && app.querySelector('.panel')) { drawPanel(); autoFloat(); }
  }
  const view = { modes: [], mode: 'inline' };

  // Tell the host how tall the card is, so it fits the chat without a scrollbar
  let lastH = 0;
  new ResizeObserver(() => { const h = Math.ceil(document.documentElement.getBoundingClientRect().height); if (h !== lastH) { lastH = h; notify('ui/notifications/size-changed', { height: h }); } }).observe(document.documentElement);

  request('ui/initialize', { appInfo: { name: 'skillshelf-card', version: '1.0.0' }, appCapabilities: {}, protocolVersion: '2026-01-26' })
    .then(r => { host = (r && r.hostCapabilities) || {}; applyContext((r && r.hostContext) || {}); notify('ui/notifications/initialized', {}); })
    .catch(() => {});

  const callTool = async (name, args) => {
    const r = await request('tools/call', { name, arguments: args });
    return data(r);
  };
  const openLink = url => request('ui/open-link', { url }).catch(() => window.open(url, '_blank', 'noopener'));
  const tellClaude = textLine => { if (host.updateModelContext) request('ui/update-model-context', { content: [{ type: 'text', text: textLine }] }).catch(() => {}); };

  // ---------- rendering ----------
  const app = document.getElementById('app');
  const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]);
  const data = r => {
    if (!r) return {};
    if (r.structuredContent) return r.structuredContent;
    try { return JSON.parse((r.content || []).find(c => c.type === 'text').text); } catch { return {}; }
  };
  const REASONS = [['generic', 'Looks generic or AI-made'], ['wrong', 'Wrong or made-up facts'], ['ignored', "Didn't follow my instructions"], ['padded', 'Too long or padded'], ['broke', 'Broke something'], ['other', 'Something else']];
  const badge = p => `<span class="badge ${esc(p.badge || 'ok')}">${esc(p.check || 'Checked')}</span>`;
  const sum = o => Object.values(o || {}).reduce((a, b) => a + b, 0);

  function show(result) {
    const d = data(result);
    if (result && result.isError && !d.note) { app.innerHTML = `<div class="card">Something went wrong. Ask Claude to try again.</div>`; return; }
    if (d.view === 'panel') return showPanel(d);
    if (d.view === 'slop') return showSlop(d);
    if (Array.isArray(d.picks)) return showPicks(d);
    if (d.found === false) return showUnlisted(d);
    if (d.found === 'several') return showSeveral(d);
    if (d.name && d.check) return showDetail(d);
    if (Array.isArray(d.steps)) return showSteps(d);
    if ('saved' in d) return showFlagResult(d);
    app.innerHTML = `<div class="card">${esc(d.note || 'Done.')}</div>`;
  }

  function cardHTML(p, open) {
    const id = esc(p.id || p.name);
    return `<article class="card" data-id="${id}">
      <div class="top"><div><h3>${esc(p.name)}</h3><div class="meta">${esc(p.kind)} · by ${esc(p.by)}</div></div>${badge(p)}</div>
      <p class="what">${esc(p.what_it_does)}</p>
      <div class="actions">
        ${(p.install || []).length ? `<button class="btn" data-act="install" aria-expanded="false">Install</button>` : ''}
        ${open ? '' : `<button class="btn" data-act="details" aria-expanded="false">What it can do</button>`}
        ${p.kind === 'Skill' ? `<button class="btn" data-act="toggle" aria-expanded="false">Switch off</button>` : ''}
        <button class="btn" data-act="slop" aria-expanded="false">Report slop</button>
        <button class="btn link" data-act="page">Full check ↗</button>
      </div>
      ${open ? `<div class="drawer">${detailHTML(p)}</div>` : ''}
      <div class="drawer act"></div>
    </article>`;
  }

  function showPicks(d) {
    if (!d.picks.length) { app.innerHTML = `<div class="card">${esc(d.note)}</div>`; return; }
    app.innerHTML = `<div class="head"><span><b>${d.picks.length} checked pick${d.picks.length > 1 ? 's' : ''}</b>${input.task ? ` for “${esc(input.task)}”` : ''}</span><span>Skillshelf</span></div>
      <div class="list">${d.picks.map(p => cardHTML(p, false)).join('')}</div>
      <div class="foot">Every pick was checked by reading its code.</div>`;
    wire(d.picks);
  }
  function showDetail(d) { app.innerHTML = `<div class="list">${cardHTML(d, true)}</div><div class="foot">Checked at commit ${esc(d.checked_commit || '')} by Skillshelf.</div>`; wire([d]); }

  function detailHTML(d) {
    const parts = [];
    for (const r of d.risks || []) { const i = r.indexOf(': '); parts.push(`<div class="row risk"><b>${esc(i > 0 ? r.slice(0, i) : r)}</b>${i > 0 ? `<span>${esc(r.slice(i + 2))}</span>` : ''}</div>`); }
    for (const w of d.worth_knowing || []) parts.push(`<div class="row note"><b>Worth knowing</b><span>${esc(w)}</span></div>`);
    if (Array.isArray(d.uses) && d.uses.length) parts.push(`<div><div class="lbl">What it can reach</div><ul class="plain">${d.uses.map(u => `<li>${esc(u)}</li>`).join('')}</ul></div>`);
    else if (typeof d.uses === 'string') parts.push(`<div class="small">${esc(d.uses)}</div>`);
    const n = sum(d.slop_reports_last_30_days);
    parts.push(`<div class="small">${n ? `Reported as slop ${n} time${n > 1 ? 's' : ''} in the last 30 days: ${Object.entries(d.slop_reports_last_30_days).map(([k, v]) => `${esc(k)} (${v})`).join(', ')}` : 'No slop reports in the last 30 days.'}</div>`);
    return parts.join('');
  }

  function installHTML(p) {
    return (p.install || []).map(line => {
      const i = line.indexOf(': '), to = line.slice(0, i), what = line.slice(i + 2);
      if (/^Download$/i.test(to)) return `<div><div class="lbl">Download</div><button class="btn" data-open="${esc(what)}">Open download page ↗</button></div>`;
      return `<div><div class="lbl">${esc(to)}</div><div class="cmd"><code>${esc(what)}</code><button class="btn" data-copy="${esc(what)}">Copy</button></div></div>`;
    }).join('') + `<div class="small">Or just ask Claude: “install ${esc(p.name)} for me”.</div>`;
  }

  function slopHTML(p) {
    return `<div class="lbl">What went wrong with ${esc(p.name)}?</div>
      <div class="chips">${REASONS.map(([k, v]) => `<button class="chip" data-reason="${k}" aria-pressed="false">${esc(v)}</button>`).join('')}</div>
      <div class="actions" style="margin-top:2px"><button class="btn primary" data-act="send" disabled>Send report</button></div>
      <div class="small">Only the reason is shared, never your chat. One report per skill per chat.</div>`;
  }

  function toggleHTML(p) {
    return `<div class="lbl">Where do you use ${esc(p.name)}?</div>
      <div class="chips"><button class="chip" data-where="claude-app">Claude app or website</button><button class="chip" data-where="claude-code">Claude Code</button></div>
      <div class="steps-out"></div>`;
  }
  const stepsHTML = d => `<ol class="steps">${d.steps.map(s => `<li>${linkifySetting(s)}</li>`).join('')}</ol>${d.note ? `<div class="small">${esc(d.note)}</div>` : ''}`;
  // Settings snippets in the steps get their own copy button
  const linkifySetting = s => {
    const m = s.match(/"skillOverrides": \{[^}]*\}/);
    if (!m) return esc(s);
    return esc(s.slice(0, m.index)) + `<div class="cmd" style="margin:4px 0"><code>${esc(m[0])}</code><button class="btn" data-copy="${esc(m[0])}">Copy</button></div>` + esc(s.slice(m.index + m[0].length));
  };

  function wire(items) {
    const byId = Object.fromEntries(items.map(p => [String(p.id || p.name), p]));
    app.querySelectorAll('article.card').forEach(card => {
      const p = byId[card.dataset.id], drawer = card.querySelector('.drawer.act');
      let reason = null;
      card.addEventListener('click', async e => {
        const t = e.target.closest('button'); if (!t) return;
        if (t.hasAttribute('data-addcc')) return;
        if (t.dataset.copy != null) return copy(t, t.dataset.copy);
        if (t.dataset.open) return openLink(t.dataset.open);
        if (t.dataset.reason) { reason = t.dataset.reason; card.querySelectorAll('[data-reason]').forEach(c => c.setAttribute('aria-pressed', String(c === t))); card.querySelector('[data-act="send"]').disabled = false; return; }
        if (t.dataset.where) {
          card.querySelectorAll('[data-where]').forEach(c => c.setAttribute('aria-pressed', String(c === t)));
          const out = card.querySelector('.steps-out'); out.innerHTML = '<div class="small">Getting the steps…</div>';
          try { out.innerHTML = stepsHTML(await callTool('how_to_toggle', { skill: p.id || p.name, where: t.dataset.where, on: false })); }
          catch { out.innerHTML = '<div class="small">Couldn’t get the steps. Ask Claude “how do I switch off ' + esc(p.name) + '?”</div>'; }
          return;
        }
        const act = t.dataset.act;
        if (act === 'page') return openLink(p.page);
        if (act === 'send') {
          t.disabled = true; t.textContent = 'Sending…';
          try {
            const r = await callTool('flag_slop', { skill: p.id || p.name, reason });
            drawer.innerHTML = flagResultHTML(r);
            if (r.saved) tellClaude(`The user reported ${p.name} as slop from the Skillshelf card (reason: ${(REASONS.find(x => x[0] === reason) || [])[1]}).`);
          } catch { drawer.innerHTML = '<div class="small">Couldn’t send it. Ask Claude to report it instead.</div>'; }
          setExpanded(card, null);
          return;
        }
        // Open or close a drawer section
        const wasOpen = t.getAttribute('aria-expanded') === 'true';
        setExpanded(card, wasOpen ? null : t);
        if (wasOpen) { drawer.innerHTML = ''; return; }
        reason = null;
        if (act === 'install') drawer.innerHTML = installHTML(p);
        else if (act === 'slop') drawer.innerHTML = slopHTML(p);
        else if (act === 'toggle') drawer.innerHTML = toggleHTML(p);
        else if (act === 'details') {
          drawer.innerHTML = '<div class="small">Loading the check…</div>';
          try { const full = await callTool('check_skill', { skill: p.id || p.name }); Object.assign(p, full); drawer.innerHTML = detailHTML(full); }
          catch { drawer.innerHTML = '<div class="small">Couldn’t load it. Open the full check instead.</div>'; }
        }
      });
    });
  }
  const setExpanded = (card, on) => card.querySelectorAll('.actions [aria-expanded]').forEach(b => b.setAttribute('aria-expanded', String(b === on)));

  function flagResultHTML(d) {
    const n = sum(d.slop_reports_last_30_days);
    return `<div class="done">${d.saved ? 'Report sent. Thank you.' : esc(d.note)}</div>${d.saved ? `<div class="small">${n} report${n === 1 ? '' : 's'} on this one in the last 30 days. Skillshelf reviews them every week.</div>` : ''}`;
  }
  function showFlagResult(d) { app.innerHTML = `<div class="card">${flagResultHTML(d)}</div>`; }
  function showSteps(d) { app.innerHTML = `<div class="card"><div class="lbl">How to switch it ${input.on === true ? 'on' : 'off'}</div>${stepsHTML(d)}</div>`; app.querySelectorAll('[data-copy]').forEach(b => b.onclick = () => copy(b, b.dataset.copy)); }
  function showUnlisted(d) {
    const cmd = (d.note.match(/npx skills add \S+ --skill \S+/) || [])[0];
    app.innerHTML = `<div class="card"><div class="top"><div><h3>Not checked yet</h3><div class="meta">This one isn’t on Skillshelf</div></div><span class="badge note">Unchecked</span></div>
      <p class="what">Nobody has read its code here. Before installing it, have your AI run Cloudflare’s open-source security check on it.</p>
      ${cmd ? `<div class="cmd"><code>${esc(cmd)}</code><button class="btn" data-copy="${esc(cmd)}">Copy</button></div>` : ''}</div>`;
    app.querySelectorAll('[data-copy]').forEach(b => b.onclick = () => copy(b, b.dataset.copy));
  }
  function showSeveral(d) {
    app.innerHTML = `<div class="head"><b>Which one did you mean?</b></div><div class="list">${d.candidates.map(c => `<button class="card btn" style="text-align:left;width:100%" data-pick="${esc(c.name)}"><h3>${esc(c.name)}</h3><div class="meta">${esc(c.kind)} · by ${esc(c.by)}</div><p class="what">${esc(c.what_it_does)}</p></button>`).join('')}</div>`;
    app.querySelectorAll('[data-pick]').forEach(b => b.onclick = async () => { app.innerHTML = '<div class="loading">Checking…</div>'; try { showDetail(await callTool('check_skill', { skill: b.dataset.pick })); } catch { app.innerHTML = '<div class="card">Couldn’t load it. Ask Claude again.</div>'; } });
  }

  // ---------- My skills: everything Claude has in this chat, with per-chat switches ----------
  const mini = c => c ? `<span class="mini ${esc(c.badge)}">${esc(c.label)}</span>` : '<span class="mini plain">Not on Skillshelf</span>';
  let P = null;   // { skills, off:Set, tab, open, toast, results, query }
  function showPanel(d) {
    P = { skills: d.skills, app: d.app || 'claude-app', off: new Set(), tab: d.skills.length ? 'mine' : 'find', open: null, toast: null, results: null, query: '' };
    drawPanel();
    autoFloat();
  }
  // The panel floats on its own as soon as it opens, once, when the host offers picture-in-picture.
  // If the host says no (some only allow it after a click), the Keep on screen button is still there.
  // Where the panel goes to sit beside the chat: a floating window if the host has one, otherwise the host's expanded view
  // (in Claude that is a side pane next to the chat). Hosts that don't say which modes they have get the expanded view tried.
  const sideMode = () => view.modes.includes('pip') ? 'pip' : (view.modes.includes('fullscreen') || !view.modes.length) ? 'fullscreen' : null;
  let floated = false;
  function autoFloat() {
    const want = sideMode();
    if (floated || !P || !want || view.mode !== 'inline') return;
    floated = true;
    request('ui/request-display-mode', { mode: want }).then(r => { view.mode = (r && r.mode) || want; drawPanel(); }).catch(() => {});
  }
  function offMessage() {
    const off = P.skills.filter(s => P.off.has(s.name)).map(s => s.name);
    return off.length ? `In this conversation the user switched these skills off with Skillshelf: ${off.join(', ')}. Don't use them unless the user asks for one by name. Every other skill is fine to use.` : 'The user switched all their skills back on for this conversation.';
  }
  function drawPanel() {
    const sk = P.skills, on = sk.length - P.off.size;
    const mine = sk.length ? sk.map(s => {
      const off = P.off.has(s.name), open = P.open === s.name;
      return `<div class="srow${off ? ' off' : ''}${open ? ' open' : ''}" data-name="${esc(s.name)}">
          <button class="smain" data-sopen aria-expanded="${open}"><div class="sname">${esc(s.name)} ${mini(s.check)}</div><div class="sdesc">${esc(s.description || (s.check ? '' : 'No description'))}</div></button>
          <button class="switch" role="switch" aria-checked="${!off}" aria-label="${esc(s.name)}: ${off ? 'off' : 'on'} in this chat" data-stoggle></button></div>
        ${open ? `<div class="sopen">${s.check ? `<div class="small">${esc(s.check.listing)} by ${esc(s.check.by)}. Skillshelf read its code: ${esc(s.check.label.toLowerCase())}.</div>` : '<div class="small">Not on Skillshelf, so nobody has checked its code there.</div>'}
          <div class="actions" style="margin:0">${P.app === 'claude-code' ? '<button class="btn" data-forgood>Turn off for good</button>' : ''}${s.check ? `<button class="btn link" data-page="${esc(s.check.page)}">Full check ↗</button><button class="btn" data-sslop>Report slop</button>` : ''}</div><div class="sslop"></div></div>` : ''}`;
    }).join('') : '<div class="pempty">No skills in this chat yet. Find some in the next tab.</div>';
    const find = `<div class="findbar"><input type="search" placeholder="What should Claude be better at?" value="${esc(P.query)}" aria-label="Find skills"><button class="btn primary" data-find>Find</button></div>
      ${P.results === null ? '<div class="pempty" style="padding-top:0">Try “make my website look less AI-made” or “write better emails”. Every result was checked by reading its code.</div>'
        : P.results === 'loading' ? '<div class="pempty" style="padding-top:0">Looking…</div>'
        : P.results.length ? `<div class="presults">${P.results.map(p => cardHTML(p, false)).join('')}</div>` : '<div class="pempty" style="padding-top:0">Nothing checked matches that yet.</div>'}`;
    app.innerHTML = `<div class="panel">
      <div class="tabs" role="tablist"><button class="tab" role="tab" data-tab="mine" aria-selected="${P.tab === 'mine'}">My skills${sk.length ? ` · ${on} on` : ''}</button><button class="tab" role="tab" data-tab="find" aria-selected="${P.tab === 'find'}">Find more</button><span class="brand">Skillshelf</span>${view.mode !== 'inline' ? '<button class="pin" data-place="inline">Back into chat</button>' : sideMode() ? `<button class="pin" data-place="${sideMode()}">Open beside chat</button>` : ''}</div>
      ${view.mode === 'fullscreen' ? '<div class="phint">Switches here work while you chat. If you can’t see the chat, click <b>Show chat</b> at the top right.</div>' : ''}
      <div>${P.tab === 'mine' ? mine : find}</div>
      ${P.toast ? `<div class="ptoast" role="status">${esc(P.toast)}</div>` : ''}
      <div class="pfoot">${P.app === 'claude-code'
        ? (P.tab === 'mine' ? 'Switches apply to this session. Open a skill and use Turn off for good to have Claude Code switch it off in your settings.' : 'Add asks Claude Code to install the skill for you. New skills load in your next session.')
        : (P.tab === 'mine' ? 'Switches apply to this chat. To switch a skill off everywhere, use Customize, then Skills.' : 'Add a skill to the Claude app from its page (Full check), or install it in Claude Code with the command.')}</div></div>`;
    if (P.tab === 'find' && Array.isArray(P.results)) {
      // These aren't installed yet, so switching them off or reporting them makes no sense here
      app.querySelectorAll('.presults [data-act="toggle"], .presults [data-act="slop"]').forEach(b => b.remove());
      if (P.app === 'claude-code') app.querySelectorAll('.presults article.card').forEach(c => { const p = P.results.find(x => String(x.id || x.name) === c.dataset.id); if (p && ccInstall(p)) c.querySelector('.actions').insertAdjacentHTML('afterbegin', '<button class="btn primary" data-addcc>Add to Claude Code</button>'); });
      wire(P.results);
    }
    const input = app.querySelector('.findbar input');
    if (input) input.onkeydown = e => { if (e.key === 'Enter') app.querySelector('[data-find]').click(); };
  }
  // In Claude Code, Claude can run commands and edit settings itself, so the panel asks it to
  const ccInstall = p => { const line = (p.install || []).find(l => / npx skills add /.test(' ' + l.slice(l.indexOf(': ') + 2))) || (p.install || []).find(l => /: claude (mcp|plugin) /.test(l)); return line ? line.slice(line.indexOf(': ') + 2) : null; };
  async function askClaude(msg, done) {
    if (host.message) { try { await request('ui/message', { role: 'user', content: [{ type: 'text', text: msg }] }); P.toast = done; } catch { P.toast = 'Couldn’t reach Claude. Ask it yourself: ' + msg; } }
    else P.toast = 'Ask Claude: ' + msg;
    drawPanel();
  }
  app.addEventListener('click', async e => {
    if (!P || !app.querySelector('.panel')) return;
    const t = e.target.closest('button'); if (!t || (t.closest('article.card') && !t.hasAttribute('data-addcc'))) return;
    if (t.hasAttribute('data-addcc')) {
      const p = P.results.find(x => String(x.id || x.name) === t.closest('article.card').dataset.id), cmd = ccInstall(p);
      return askClaude(`Install the ${p.name} skill (Skillshelf checked its code: ${p.check}) by running: ${cmd}\nTell me when it's done.`, `Asked Claude Code to install ${p.name}. It loads in your next session.`);
    }
    const row = t.closest('[data-name]') || (t.closest('.sopen') && t.closest('.sopen').previousElementSibling);
    const s = row && P.skills.find(x => x.name === row.dataset.name);
    if (t.dataset.tab) { P.tab = t.dataset.tab; P.toast = null; return drawPanel(); }
    if (t.dataset.place) {
      const want = t.dataset.place;
      try { const r = await request('ui/request-display-mode', { mode: want }); view.mode = (r && r.mode) || want; P.toast = view.mode === want ? null : 'Claude’s app kept it where it was.'; }
      catch { P.toast = 'Claude’s app didn’t allow that here.'; }
      return drawPanel();
    }
    if (t.dataset.page) return openLink(t.dataset.page);
    if (t.hasAttribute('data-sopen')) { P.open = P.open === s.name ? null : s.name; return drawPanel(); }
    if (t.hasAttribute('data-forgood')) return askClaude(`Turn off the "${s.name}" skill in Claude Code for good: add "${s.name}": "off" under "skillOverrides" in ~/.claude/settings.json (or in this project's .claude/settings.local.json if it's a project skill), keeping every other setting. If it comes from a plugin, tell me to switch the plugin with /plugin instead. Then confirm.`, `Asked Claude Code to turn ${s.name} off for good.`);
    if (t.hasAttribute('data-stoggle')) {
      const nowOff = !P.off.has(s.name);
      nowOff ? P.off.add(s.name) : P.off.delete(s.name);
      P.toast = `${s.name} is ${nowOff ? 'off' : 'on'} in this chat.`;
      if (host.updateModelContext) request('ui/update-model-context', { content: [{ type: 'text', text: offMessage() }] }).catch(() => {});
      else if (host.message) request('ui/message', { role: 'user', content: [{ type: 'text', text: nowOff ? `Please don't use the ${s.name} skill in this chat.` : `You can use the ${s.name} skill again in this chat.` }] }).catch(() => {});
      return drawPanel();
    }
    if (t.hasAttribute('data-find')) {
      P.query = app.querySelector('.findbar input').value.trim(); if (!P.query) return;
      P.results = 'loading'; drawPanel();
      try { P.results = (await callTool('find_skills', { task: P.query, kind: 'skill' })).picks || []; } catch { P.results = []; }
      return drawPanel();
    }
    if (t.hasAttribute('data-sslop')) {
      const box = t.closest('.sopen').querySelector('.sslop');
      box.innerHTML = `<div class="chips">${REASONS.map(([k, v]) => `<button class="chip" data-sreason="${k}">${esc(v)}</button>`).join('')}</div><div class="small" style="margin-top:4px">Tap a reason to send it. Only the reason is shared.</div>`;
      return;
    }
    if (t.dataset.sreason) {
      const box = t.closest('.sslop'), sk = P.skills.find(x => x.name === t.closest('.sopen').previousElementSibling.dataset.name);
      box.innerHTML = '<div class="small">Sending…</div>';
      try { const r = await callTool('flag_slop', { skill: sk.check.id, reason: t.dataset.sreason }); box.innerHTML = `<div class="small"><b>${r.saved ? 'Report sent. Thank you.' : esc(r.note)}</b></div>`; }
      catch { box.innerHTML = '<div class="small">Couldn’t send it. Try again later.</div>'; }
    }
  });

  // ---------- Slop check: highlight the tells, then ban them for this chat or every chat ----------
  function showSlop(d) {
    P = null;
    const marks = d.hits.flatMap(h => h.matches.map(m => ({ ...m, id: h.id, label: h.label }))).sort((a, b) => a.start - b.start);
    let html = '', at = 0;
    for (const m of marks) { if (m.start < at) continue; html += esc(d.text.slice(at, m.start)) + `<mark title="${esc(m.label)}">${esc(d.text.slice(m.start, m.end))}</mark>`; at = m.end; }
    html += esc(d.text.slice(at));
    app.innerHTML = `<div class="panel">
      <div class="verdict"><b class="lv-${esc(d.level)}">${esc(d.verdict)}</b><span class="small">${d.total} tell${d.total === 1 ? '' : 's'} in ${d.words} words</span></div>
      ${d.words ? `<div class="quote">${html}</div>` : ''}
      ${d.hits.length ? `<div class="tells">${d.hits.map(h => `<label class="tell"><input type="checkbox" checked data-hit="${esc(h.id)}"><span><b>${esc(h.label)}</b> <span class="small">×${h.count}</span><br><span class="ex">${esc(h.why)}. ${h.examples.length ? 'Found: ' + h.examples.map(x => `“${esc(x)}”`).join(', ') : ''}</span></span></label>`).join('')}</div>
      <div class="slopacts"><button class="btn primary" data-ban="chat">Avoid these in this chat</button><button class="btn" data-ban="rewrite">Rewrite it without them</button><button class="btn" data-ban="always">Avoid in every chat</button></div>
      <div class="everywhere"></div>` : ''}
      <div class="pfoot">These are common patterns, not proof: people use some of them too. Your text isn't stored.</div></div>`;
    const chosen = () => d.hits.filter(h => app.querySelector(`[data-hit="${h.id}"]`).checked);
    const NAMES = { buzzwords: 'AI buzzwords', openers: 'stock openers', filler: 'filler phrases', notjust: '"it\'s not X, it\'s Y" contrasts', wrapup: 'wrap-up lines', eager: 'eager openings', emdash: 'heavy use of em dashes', whether: '"whether you\'re X or Y" lines', reveal: 'fake suspense', hedge: 'stacked hedges', emoji: 'emoji bullets' };
    const rule = hs => `Don't write like a chatbot. Avoid ${hs.map(h => `${NAMES[h.id] || h.label}${h.examples.length && h.id !== 'emdash' ? ` (like ${h.examples.slice(0, 4).map(x => `"${x}"`).join(', ')})` : ''}`).join('; ')}.`;
    app.querySelectorAll('[data-ban]').forEach(b => b.onclick = async () => {
      const hs = chosen(); if (!hs.length) return;
      const out = app.querySelector('.everywhere');
      if (b.dataset.ban === 'chat') {
        const ok = host.updateModelContext ? await request('ui/update-model-context', { content: [{ type: 'text', text: `For the rest of this conversation, the user wants none of these in anything you write. ${rule(hs)}` }] }).then(() => true, () => false) : false;
        out.innerHTML = `<div class="small"><b>${ok ? 'Done. Claude will avoid these for the rest of this chat.' : 'Tell Claude: “' + esc(rule(hs)) + '”'}</b></div>`;
      } else if (b.dataset.ban === 'rewrite') {
        await request('ui/message', { role: 'user', content: [{ type: 'text', text: `Rewrite the text I pasted so it sounds like a person wrote it. ${rule(hs)} Keep the meaning and length.` }] }).catch(() => { out.innerHTML = '<div class="small">Ask Claude to rewrite it without these.</div>'; });
      } else {
        const r = rule(hs);
        out.innerHTML = `<div class="small">Paste this into Claude's Settings, in the personal preferences box, and Claude will follow it in every chat:</div><div class="cmd"><code style="white-space:normal">${esc(r)}</code><button class="btn" data-copy="${esc(r)}">Copy</button></div>`;
        out.querySelector('[data-copy]').onclick = e => copy(e.target, r);
      }
    });
  }

  async function copy(btn, value) {
    const done = ok => { btn.textContent = ok ? 'Copied' : 'Select it to copy'; setTimeout(() => { btn.textContent = 'Copy'; }, 1600); };
    try { await navigator.clipboard.writeText(value); return done(true); } catch {}
    try {
      const code = btn.parentElement.querySelector('code'), r = document.createRange();
      r.selectNodeContents(code); const s = getSelection(); s.removeAllRanges(); s.addRange(r);
      done(document.execCommand('copy'));
    } catch { done(false); }
  }
})();
</script>
</body>
</html>
