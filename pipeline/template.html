<title>Vetted Skill Store</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Layout: app-store pattern. Sidebar on desktop, bottom tab bar on phones; Today stories, shelves, product pages, install sheet. All listings are real repos. */
:root {
  --bg: #FFFFFF; --bg2: #F2F2F7; --card: #FFFFFF; --label: #000000; --label2: #6E6E73; --label3: #AEAEB2;
  --sep: rgba(60, 60, 67, 0.18); --fill: #EEEEF3; --blue: #007AFF; --red: #FF3B30; --green: #248A3D; --orange: #C26A00;
  --sidebar: #F5F5F7; --scrim: rgba(0, 0, 0, 0.4); --shadow: 0 10px 40px rgba(0, 0, 0, 0.12); --code: #F6F6F9;
  --font: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Display", "Segoe UI Variable Text", "Segoe UI", system-ui, "Helvetica Neue", Arial, sans-serif;
  --mono: ui-monospace, "SF Mono", "Cascadia Mono", Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #000000; --bg2: #1C1C1E; --card: #1C1C1E; --label: #FFFFFF; --label2: #98989F; --label3: #636366;
  --sep: rgba(84, 84, 88, 0.6); --fill: #2C2C2E; --blue: #0A84FF; --red: #FF453A; --green: #30D158; --orange: #FF9F0A;
  --sidebar: #141416; --scrim: rgba(0, 0, 0, 0.6); --shadow: 0 10px 40px rgba(0, 0, 0, 0.6); --code: #0F0F11; color-scheme: dark;
} }
:root[data-theme="dark"] {
  --bg: #000000; --bg2: #1C1C1E; --card: #1C1C1E; --label: #FFFFFF; --label2: #98989F; --label3: #636366;
  --sep: rgba(84, 84, 88, 0.6); --fill: #2C2C2E; --blue: #0A84FF; --red: #FF453A; --green: #30D158; --orange: #FF9F0A;
  --sidebar: #141416; --scrim: rgba(0, 0, 0, 0.6); --shadow: 0 10px 40px rgba(0, 0, 0, 0.6); --code: #0F0F11; color-scheme: dark;
}

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; }
body { background: var(--bg); color: var(--label); font-family: var(--font); font-size: 15px; line-height: 1.4; -webkit-font-smoothing: antialiased; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--bg); }
h1, h2, h3, h4 { margin: 0; text-wrap: balance; }
p { margin: 0; }
a { color: var(--blue); text-decoration: none; }
button { font: inherit; color: inherit; cursor: pointer; border: 0; background: none; padding: 0; }
:focus-visible { outline: 2px solid var(--blue); outline-offset: 2px; border-radius: 6px; }
.mono { font-family: var(--mono); font-size: 0.9em; }
.ic { width: 1em; height: 1em; flex: none; }
.c-green { color: var(--green); } .c-orange { color: var(--orange); } .c-red { color: var(--red); } .c-blue { color: var(--blue); } .c-gray { color: var(--label2); }

/* Shell */
.shell { display: grid; grid-template-columns: 240px minmax(0, 1fr); min-height: 100%; }
.side { background: var(--sidebar); border-right: 1px solid var(--sep); padding: 18px 12px; position: sticky; top: 0; height: 100vh; display: flex; flex-direction: column; gap: 4px; }
.wordmark { display: flex; align-items: center; gap: 8px; font-weight: 700; font-size: 17px; padding: 4px 10px 12px; }
.mark { width: 26px; height: 26px; border-radius: 7px; background: linear-gradient(160deg, #3B82F6, #1D4ED8); color: #FFFFFF; display: grid; place-items: center; font-size: 15px; }
.side-search { position: relative; margin: 0 4px 10px; display: block; }
.side-search input, .search-field input { width: 100%; border: 0; background: var(--fill); color: var(--label); border-radius: 10px; padding: 8px 10px 8px 32px; font: inherit; }
.side-search .ic, .search-field .ic { position: absolute; left: 10px; top: 50%; transform: translateY(-50%); color: var(--label2); font-size: 15px; }
.nav-item { display: flex; align-items: center; gap: 10px; padding: 7px 10px; border-radius: 8px; color: var(--label); font-size: 15px; font-weight: 500; width: 100%; text-align: left; }
.nav-item .ic { color: var(--blue); font-size: 18px; }
.nav-item[aria-current="page"] { background: var(--fill); }
.nav-item .n { margin-left: auto; color: var(--label2); font-size: 13px; font-variant-numeric: tabular-nums; }
.side-foot { margin-top: auto; padding: 10px; font-size: 12px; color: var(--label2); line-height: 1.45; }
.tabbar { display: none; }
.main { min-width: 0; }
.page { max-width: 1120px; margin: 0 auto; padding-block: 28px 60px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
@media (min-width: 761px) { .page { padding-left: 36px; padding-right: 36px; } }
.date-eyebrow { font-size: 13px; font-weight: 600; color: var(--label2); text-transform: uppercase; letter-spacing: 0.02em; }
.large-title { margin-bottom: 18px; }
.large-title h1 { font-size: 34px; font-weight: 700; letter-spacing: 0.01em; }
.large-title p { color: var(--label2); font-size: 15px; margin-top: 4px; max-width: 70ch; }
.data-note { margin-top: 40px; font-size: 12px; color: var(--label2); border-top: 1px solid var(--sep); padding-top: 14px; max-width: 80ch; line-height: 1.5; }

/* Today */
.today { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 26px; }
.story { position: relative; border-radius: 18px; overflow: hidden; aspect-ratio: 4 / 5; max-width: 100%; box-shadow: var(--shadow); color: #FFFFFF; text-align: left; display: flex; flex-direction: column; transition: transform .25s cubic-bezier(.2,.8,.2,1); width: 100%; }
.story:hover { transform: scale(0.99); }
.story:active { transform: scale(0.97); }
.story .art { position: absolute; inset: 0; }
.story .copy { position: relative; padding: 20px 20px 0; display: flex; flex-direction: column; gap: 4px; }
.story .eyebrow { font-size: 13px; font-weight: 600; text-transform: uppercase; opacity: 0.8; letter-spacing: 0.02em; }
.story .title { font-size: 28px; font-weight: 800; line-height: 1.08; letter-spacing: -0.01em; max-width: 16ch; }
.story .bottom { position: relative; margin-top: auto; padding: 0 20px 20px; font-size: 15px; opacity: .9; }
.story .bottom.frost { opacity: 1; padding: 12px 16px; background: rgba(255,255,255,.16); backdrop-filter: blur(20px) saturate(1.4); -webkit-backdrop-filter: blur(20px) saturate(1.4); display: flex; align-items: center; gap: 12px; }
.story .bottom.frost .t { flex: 1; min-width: 0; }
.story .bottom.frost b { display: block; font-size: 15px; }
.story .bottom.frost span { font-size: 13px; opacity: .85; display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.story.wide { grid-column: 1 / -1; aspect-ratio: 2.2 / 1; }
.story.wide .title { font-size: 40px; max-width: 14ch; }
.glyph-art { position: absolute; right: -6%; bottom: 12%; width: 62%; aspect-ratio: 1; opacity: 0.2; color: #FFFFFF; }
.story.wide .glyph-art { width: 34%; right: 4%; bottom: -4%; }
.orb { position: absolute; border-radius: 50%; }
.stat-big { font-size: 64px; font-weight: 800; line-height: 1; letter-spacing: -0.02em; }

/* Shelves */
.shelf { margin-top: 34px; }
.shelf-head { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; border-top: 1px solid var(--sep); padding-top: 14px; margin-bottom: 12px; }
.shelf-head h2 { font-size: 22px; font-weight: 700; }
.shelf-head .sub { color: var(--label2); font-size: 15px; display: block; font-weight: 400; margin-top: 2px; }
.see-all { font-size: 17px; white-space: nowrap; color: var(--blue); }
.scroller { display: grid; grid-auto-flow: column; gap: 18px; overflow-x: auto; scroll-snap-type: x mandatory; scrollbar-width: none; padding-bottom: 4px; }
.scroller::-webkit-scrollbar { display: none; }
.scroller > * { scroll-snap-align: start; }
.banners { grid-auto-columns: minmax(0, calc((100% - 18px) / 2)); }
.banner { display: flex; flex-direction: column; gap: 3px; text-align: left; min-width: 0; color: var(--label); }
.banner .eb { font-size: 12px; font-weight: 600; color: var(--blue); text-transform: uppercase; letter-spacing: 0.02em; }
.banner .bt { font-size: 21px; font-weight: 600; }
.banner .bs { font-size: 16px; color: var(--label2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.banner .bart { margin-top: 8px; border-radius: 12px; aspect-ratio: 16 / 9; max-width: 100%; position: relative; overflow: hidden; display: flex; align-items: flex-end; padding: 16px; color: #FFFFFF; }
.banner .bart .bline { position: relative; display: flex; align-items: center; gap: 10px; font-size: 14px; font-weight: 600; }
.ranked { grid-template-rows: repeat(3, auto); grid-auto-columns: minmax(300px, calc((100% - 36px) / 3)); column-gap: 18px; row-gap: 0; }
.ranked.two { grid-template-rows: repeat(2, auto); }
.ranked.one { grid-template-rows: auto; }
.tiles { grid-auto-columns: 118px; }
.tile { display: flex; flex-direction: column; gap: 6px; text-align: left; color: var(--label); min-width: 0; }
.tile .icon { width: 118px; height: 118px; }
.tile b { font-size: 14px; font-weight: 500; display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tile span { font-size: 12px; color: var(--label2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

/* Icons */
.icon { flex: none; border-radius: 22.5%; display: grid; place-items: center; color: #FFFFFF; position: relative; overflow: hidden; box-shadow: inset 0 0 0 0.5px rgba(0,0,0,.14); background: var(--fill); }
.icon::after { content: ""; position: absolute; inset: 0; background: linear-gradient(180deg, rgba(255,255,255,.2), rgba(255,255,255,0) 55%); pointer-events: none; }
.icon > svg { width: 50%; height: 50%; }
.icon > img { width: 100%; height: 100%; object-fit: cover; display: block; }
.icon .av { position: absolute; right: 6%; bottom: 6%; width: 34%; height: 34%; border-radius: 28%; background: #FFFFFF; box-shadow: 0 1px 4px rgba(0,0,0,.3); overflow: hidden; z-index: 1; }
.icon .av img { width: 100%; height: 100%; display: block; }

/* Rows */
.row { display: flex; align-items: center; gap: 12px; padding: 10px 0; min-width: 0; }
.row .rank { width: 18px; font-size: 17px; font-weight: 600; text-align: center; flex: none; }
.row-body { flex: 1; min-width: 0; display: flex; align-items: center; gap: 12px; align-self: stretch; border-bottom: 1px solid var(--sep); padding-block: 6px; }
.ranked .row:nth-child(3n) .row-body, .ranked.two .row:nth-child(2n) .row-body, .ranked.one .row-body { border-bottom: 0; }
.ranked.two .row:nth-child(3n) .row-body { border-bottom: 1px solid var(--sep); }
.ranked.two .row:nth-child(6n) .row-body { border-bottom: 0; }
.row-txt { flex: 1; min-width: 0; text-align: left; }
.row-txt b { display: block; font-size: 16px; font-weight: 500; color: var(--label); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.row-txt span { display: block; font-size: 13px; color: var(--label2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.btn-col { display: flex; flex-direction: column; align-items: center; gap: 3px; flex: none; }
.iap { font-size: 10px; color: var(--label2); white-space: nowrap; display: inline-flex; align-items: center; gap: 2px; }
.get { min-width: 76px; height: 30px; border-radius: 15px; background: var(--fill); color: var(--blue); font-size: 15px; font-weight: 700; letter-spacing: 0.02em; padding: 0 16px; display: inline-grid; place-items: center; }
.get.primary { background: var(--blue); color: #FFFFFF; }
.get.light { background: #FFFFFF; color: #007AFF; }
.pill-link { display: inline-flex; align-items: center; gap: 6px; height: 30px; padding: 0 14px; border-radius: 15px; background: var(--fill); color: var(--blue); font-weight: 600; font-size: 14px; }

/* Product page */
.navbar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: color-mix(in srgb, var(--bg) 82%, transparent); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); }
.navbar .in { max-width: 1120px; margin: 0 auto; display: flex; align-items: center; gap: 10px; padding-block: 10px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
@media (min-width: 761px) { .navbar .in { padding-left: 36px; padding-right: 36px; } }
.back { display: inline-flex; align-items: center; gap: 2px; color: var(--blue); font-size: 17px; }
.back .ic { font-size: 22px; }
.product-head { display: flex; gap: 20px; align-items: flex-start; }
.product-head .icon { width: 128px; height: 128px; }
.product-head .txt { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; min-height: 128px; }
.product-head h1 { font-size: 26px; font-weight: 700; overflow-wrap: anywhere; }
.product-head .sub { font-size: 17px; color: var(--label2); }
.product-head .acts { margin-top: auto; display: flex; align-items: center; gap: 10px; padding-top: 12px; flex-wrap: wrap; }
.strip { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(118px, 1fr); overflow-x: auto; scrollbar-width: none; margin-top: 22px; border-block: 1px solid var(--sep); padding-block: 12px; }
.strip::-webkit-scrollbar { display: none; }
.strip > div { text-align: center; padding: 0 10px; border-left: 1px solid var(--sep); display: flex; flex-direction: column; align-items: center; gap: 2px; min-width: 0; }
.strip > div:first-child { border-left: 0; }
.strip .k { font-size: 11px; font-weight: 600; color: var(--label3); text-transform: uppercase; letter-spacing: 0.02em; white-space: nowrap; }
.strip .v { font-size: 20px; font-weight: 700; color: var(--label2); display: flex; align-items: center; gap: 4px; white-space: nowrap; font-variant-numeric: tabular-nums; }
.strip .v.c-green { color: var(--green); } .strip .v.c-blue { color: var(--blue); }
.strip .c { font-size: 12px; color: var(--label2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100%; }
.desc { margin-top: 26px; display: grid; grid-template-columns: minmax(0, 1fr) 260px; gap: 30px; }
.desc p { font-size: 15px; line-height: 1.55; max-width: 68ch; overflow-wrap: anywhere; }
.desc > div { min-width: 0; }
.desc p.clamp { display: -webkit-box; -webkit-line-clamp: 5; -webkit-box-orient: vertical; overflow: hidden; }
.desc .more { color: var(--blue); font-size: 15px; font-weight: 600; margin-top: 4px; }
.desc .lbl { display: block; font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .03em; color: var(--label2); margin-bottom: 4px; }
.desc .dev a { font-size: 15px; display: block; overflow-wrap: anywhere; }
.desc .dev span { font-size: 13px; color: var(--label2); display: block; }
.desc .dev > div + div { margin-top: 12px; }

/* Install blocks */
.inst-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 14px; }
.inst-card { background: var(--bg2); border-radius: 14px; padding: 14px 16px; display: flex; flex-direction: column; gap: 10px; min-width: 0; }
.sheet .inst-card { background: var(--card); }
.inst-card .h { display: flex; align-items: center; gap: 8px; }
.inst-card .h b { font-size: 16px; }
.inst-card .how { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .03em; color: var(--label2); background: var(--fill); padding: 2px 7px; border-radius: 5px; }
.inst-card .note { font-size: 13px; color: var(--label2); }
.inst-card.scan { background: color-mix(in srgb, var(--green) 10%, var(--bg2)); }
.sheet .inst-card.scan { background: color-mix(in srgb, var(--green) 10%, var(--card)); }
.copybox { display: flex; gap: 8px; align-items: center; background: var(--code); border: 1px solid var(--sep); border-radius: 10px; padding: 8px 8px 8px 12px; min-width: 0; }
.copybox code { flex: 1; min-width: 0; font-family: var(--mono); font-size: 12.5px; overflow-x: auto; white-space: nowrap; scrollbar-width: thin; }
.copy-btn { flex: none; width: 30px; height: 30px; border-radius: 8px; display: grid; place-items: center; color: var(--blue); font-size: 16px; }
.copy-btn:hover { background: var(--fill); }
.seg { display: inline-flex; background: var(--fill); border-radius: 9px; padding: 2px; gap: 2px; flex-wrap: wrap; }
.seg button { padding: 4px 10px; border-radius: 7px; font-size: 13px; font-weight: 600; color: var(--label2); }
.seg button[aria-pressed="true"] { background: var(--card); color: var(--label); box-shadow: 0 1px 3px rgba(0,0,0,.12); }

/* Trust */
.trust-cards { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px; }
.t-card { background: var(--bg2); border-radius: 14px; padding: 18px 16px; display: flex; flex-direction: column; gap: 8px; min-width: 0; }
.t-card .top { display: flex; align-items: center; gap: 10px; }
.t-card .top .ic { font-size: 28px; }
.t-card h3 { font-size: 16px; font-weight: 600; }
.t-card p { font-size: 13.5px; color: var(--label2); line-height: 1.45; }
.t-card .score { font-size: 34px; font-weight: 800; font-variant-numeric: tabular-nums; }
.t-card .score small { font-size: 15px; color: var(--label2); font-weight: 600; }
.checks { list-style: none; margin: 4px 0 0; padding: 0; display: flex; flex-direction: column; gap: 6px; }
.checks li { display: grid; grid-template-columns: minmax(0, 1fr) 70px 24px; gap: 8px; align-items: center; font-size: 13px; }
.checks .bar { height: 5px; border-radius: 3px; background: var(--fill); overflow: hidden; }
.checks .bar i { display: block; height: 100%; border-radius: 3px; }
.checks .n { text-align: right; font-variant-numeric: tabular-nums; color: var(--label2); }
.kv { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; }
.kv li { display: flex; justify-content: space-between; gap: 10px; padding: 6px 0; border-bottom: 1px solid var(--sep); font-size: 13.5px; }
.kv li:last-child { border-bottom: 0; }
.kv span:first-child { color: var(--label2); }

/* SkillSpector report */
.rep { display: grid; grid-template-columns: minmax(0, 1.1fr) minmax(0, 1fr) minmax(0, 1fr); gap: 14px; align-items: stretch; }
.rep > * { background: var(--bg2); border-radius: 14px; padding: 16px; min-width: 0; }
.rep-score { display: flex; align-items: center; gap: 16px; }
.dial { --p: 0; width: 92px; height: 92px; border-radius: 50%; flex: none; display: grid; place-items: center;
  background: conic-gradient(currentColor calc(var(--p) * 1%), var(--fill) 0); }
.dial span { width: 74px; height: 74px; border-radius: 50%; background: var(--bg2); display: flex; flex-direction: column; align-items: center; justify-content: center; line-height: 1; }
.dial b { font-size: 28px; font-weight: 800; color: var(--label); font-variant-numeric: tabular-nums; }
.dial small { font-size: 11px; color: var(--label2); margin-top: 2px; }
.sevword { font-size: 20px; font-weight: 700; }
.rec { font-size: 13.5px; color: var(--label2); margin-top: 2px; }
.rep-counts { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; align-content: center; }
.cnt { display: flex; flex-direction: column; font-size: 12px; color: var(--label2); }
.cnt b { font-size: 24px; font-weight: 800; font-variant-numeric: tabular-nums; }
.caveat { font-size: 13px; color: var(--label2); margin-top: 10px; max-width: 80ch; line-height: 1.5; }
.findings { display: flex; flex-direction: column; margin-top: 12px; background: var(--bg2); border-radius: 14px; overflow: hidden; }
.fd { padding: 12px 16px; border-top: 1px solid var(--sep); display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.fd:first-child { border-top: 0; }
.fh { display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; }
.fh b { font-size: 15px; }
.sev { font-size: 11px; font-weight: 800; letter-spacing: .03em; }
.pid { color: var(--label3); font-size: 12px; margin-left: auto; }
.pat { font-size: 13.5px; }
.loc { font-size: 12px; overflow-wrap: anywhere; }
.snip { display: block; font-family: var(--mono); font-size: 12px; background: var(--code); border: 1px solid var(--sep); border-radius: 8px; padding: 6px 10px; overflow-x: auto; white-space: pre; }
.fd .why { font-size: 13px; color: var(--label2); }
@media (max-width: 1000px) { .rep { grid-template-columns: minmax(0, 1fr); } }

/* Trusted publisher */
.trusted-note { display: flex; gap: 14px; align-items: flex-start; background: color-mix(in srgb, var(--blue) 9%, var(--bg2)); border-radius: 14px; padding: 16px; }
.trusted-note > .ic { font-size: 30px; color: var(--blue); flex: none; }
.trusted-note b { font-size: 18px; display: block; }
.trusted-note p { color: var(--label2); font-size: 14px; margin-top: 2px; max-width: 75ch; }
.scan-anyway { margin-top: 14px; }
.scan-anyway > summary { cursor: pointer; color: var(--blue); font-size: 15px; font-weight: 600; padding: 6px 0; }
.scan-anyway[open] > summary { margin-bottom: 4px; }

.worth { margin-top: 12px; background: color-mix(in srgb, var(--orange) 10%, var(--bg2)); border-radius: 14px; padding: 14px 16px; display: flex; flex-direction: column; gap: 6px; }
.worth b { font-size: 16px; }
.worth p { font-size: 14px; color: var(--label2); line-height: 1.5; max-width: 80ch; }
.ev-row { display: flex; gap: 6px; flex-wrap: wrap; }

/* Purpose check */
.pc-verdict { display: flex; gap: 14px; align-items: flex-start; background: var(--bg2); border-radius: 14px; padding: 16px; }
.pc-verdict > .ic { font-size: 34px; flex: none; }
.pc-verdict b { font-size: 19px; display: block; }
.pc-verdict p { color: var(--label2); font-size: 14px; margin-top: 2px; }
.pc-verdict .purpose { color: var(--label); margin-top: 8px; }
.pc-verdict .purpose span { display: block; font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .03em; color: var(--label2); }

function purposeHTML(l) {
  const m = (D.MR || {})[l.id];
  if (!m) return '';
  const r = repoOf(l);
  if (m.codeFree) return `<section class="shelf"><div class="shelf-head"><h2>Purpose Check<span class="sub">Checked ${fmtDate(m.reviewDate)}</span></h2></div>
    <div class="pc-verdict c-green">${ic('shieldok', 1.8)}<div><b>Instructions only</b><p>This skill is plain instructions for your assistant. It ships no code that runs on your machine, so it can only do what your assistant is already allowed to do.</p>
      <p class="purpose"><span>Stated purpose</span>${esc(m.purpose)}</p></div></div>
    <p class="caveat">The risk with instruction-only skills is in the words: hidden instructions, or steps that tell your assistant to run risky commands. That's what SkillSpector's report below checks.</p></section>`;
  const gh = (f, n) => `https://github.com/${l.r}/blob/${r.br}/${l.p ? l.p + '/' : ''}${String(f).replace(/\\/g, '/')}${n ? '#L' + n : ''}`;
  const V = { fits: ['c-green', 'shieldok', 'Fits its purpose', 'Everything it can do matches what it says it\'s for.'],
    review: ['c-orange', 'shieldq', 'Does more than its stated purpose', 'It can do things its purpose doesn\'t explain. Check the unexpected items below.'],
    flag: ['c-red', 'shieldq', 'Flagged', 'It touches secret files or a tool description contains hidden instructions.'] }[m.verdict];
  const P = m.peers || { n: 1, worse: 0, median: 0 };
  const kindWord = { skill: 'skills', mcp: 'MCP servers', tool: 'apps' }[m.kind];
  const w = m.findings.where, tot = Math.max(1, m.findings.total);
  const seg = [['production', 'Production code', 'var(--orange)'], ['tests & tooling', 'Tests & tooling', 'var(--label3)'], ['docs', 'Docs', 'var(--blue)'], ['other', 'Other files', 'var(--fill)']];
  const capRows = m.caps.filter(c => c.found || c.expected).map(c => {
    const st = !c.found ? ['c-gray', 'Not used', c.why ? `Allowed for its purpose (${esc(c.why.toLowerCase())}), but not found in the code.` : '']
      : c.expected ? ['c-green', 'Expected', esc(c.why)]
      : c.reviewed ? ['c-blue', 'Reviewed: benign', esc(c.reviewed)]
      : ['c-orange', 'Unexpected', 'Not explained by its stated purpose.'];
    return `<li class="cap"><div class="cap-h"><b>${esc(c.label)}</b><span class="chip ${st[0]}">${st[1]}</span></div>${st[2] ? `<p>${st[2]}</p>` : ''}
      ${c.found && !c.expected ? c.ex.map(e => `<a class="ev mono" href="${gh(e[0], e[1])}" target="_blank" rel="noopener"><span>${esc(e[0])}:${e[1]}</span><code>${esc(e[2])}</code></a>`).join('') : ''}</li>`;
  }).join('');
  return `<section class="shelf"><div class="shelf-head"><h2>Purpose Check<span class="sub">Judged against what it says it's for, not on one fixed scale · reviewed ${fmtDate(m.reviewDate)}</span></h2></div>
    <div class="pc-verdict ${V[0]}">${ic(V[1], 1.8)}<div><b>${V[2]}</b><p>${V[3]}</p><p class="purpose"><span>Stated purpose${m.auto ? ' (from its description; expected access inferred from it)' : ''}</span>${esc(m.purpose)}</p></div></div>
    ${m.note ? `<p class="empty-note" style="margin-top:12px">${esc(m.note)}</p>` : ''}
    ${(m.notices || []).map(n => `<div class="worth"><div class="cap-h"><b>${esc(n.title)}</b><span class="chip c-orange">Worth knowing</span></div><p>${esc(n.note)}</p>
      <div class="ev-row">${(n.where || []).map(([f, ln]) => `<a class="ev mono" href="${gh(f, ln)}" target="_blank" rel="noopener"><span>${esc(f)}:${ln}</span></a>`).join('')}</div></div>`).join('')}
    <div class="pc-grid">
      <div class="pc-card"><h3>What it can do</h3><p class="pc-sub">Found by reading its ${m.files.production} production code files (${m.loc.toLocaleString('en-US')} lines).</p><ul class="caps">${capRows || '<li class="cap"><p>No access to files, network, programs or secrets found.</p></li>'}</ul></div>
      <div class="pc-side">
        ${m.kind === 'mcp' ? `<div class="pc-card"><h3>Its tools</h3>
          ${m.toolCount ? `<p class="pc-sub">Read ${m.toolCount} tool description${m.toolCount > 1 ? 's' : ''} from the source. ${m.poisoned ? `<b class="c-red">${m.poisoned} with suspicious instructions in the description.</b>` : 'No hidden instructions in any description.'}</p>
            <details class="tools"><summary>Show tools</summary><ul>${m.tools.map(t => `<li><span class="mono">${esc(t.name)}</span>${t.desc ? `<p>${esc(t.desc)}</p>` : ''}${t.flags.length ? `<p class="c-red">${esc(t.flags.join(', '))}</p>` : ''}</li>`).join('')}</ul></details>`
            : `<p class="pc-sub">Couldn't read the tool list from the source automatically.</p>`}
          ${m.reviewNotes?.poisoning ? `<p class="pc-sub"><span class="chip c-blue">Reviewed: benign</span> ${esc(m.reviewNotes.poisoning)}</p>` : ''}</div>` : ''}
        ${m.hasScan ? `<div class="pc-card"><h3>Where SkillSpector's findings are</h3>
          <div class="stack">${seg.map(([k, , c]) => w[k] ? `<i style="width:${(w[k] / tot) * 100}%;background:${c}"></i>` : '').join('')}</div>
          <ul class="legend">${seg.map(([k, n, c]) => `<li><span class="dotsrc" style="background:${c}"></span>${n}<b>${w[k]}</b></li>`).join('')}</ul>
          <p class="pc-sub">${m.seriousCode} high or critical finding${m.seriousCode === 1 ? '' : 's'} in running code${m.seriousComment ? `, plus ${m.seriousComment} inside code comments (mostly comments describing attacks the code blocks)` : ''}.</p>
          ${Object.keys(m.other || {}).length ? `<ul class="caps">${Object.entries(m.other).map(([k, o]) => `<li class="cap"><div class="cap-h"><b>${esc(k)}</b><span class="chip ${o.note ? 'c-blue' : 'c-orange'}">${o.n} · ${o.note ? 'Reviewed: benign' : 'Not reviewed'}</span></div>${o.note ? `<p>${esc(o.note)}</p>` : ''}
            ${o.ex.map(e => `<a class="ev mono" href="${gh(e[0], e[1])}" target="_blank" rel="noopener"><span>${esc(e[0])}:${e[1]}</span></a>`).join('')}</li>`).join('')}</ul>` : ''}</div>
        <div class="pc-card"><h3>Compared with other ${kindWord}</h3>
          <div class="score">${m.findings.density}<small> per 1,000 lines</small></div>
          <p class="pc-sub">Weighted high and critical findings in running code. ${m.findings.density === 0 ? `Tied for cleanest of the ${P.n} ${kindWord} with code.` : P.worse ? `Lower than ${P.worse} of the other ${P.n - 1}.` : `The highest of the ${P.n} checked.`} Median: ${P.median}.</p></div>` : ''}
      </div>
    </div>
    <p class="caveat">${m.hasScan ? 'SkillSpector\'s raw score below counts every file in the repository, including tests and docs. ' : ''}The Purpose Check counts only code that runs, and every mismatch was read line by line before being marked benign. Running it in a sandbox and watching what it does would be stronger still.</p>
  </section>`;
}

        <div class="t-card"><div class="top"><span class="c-blue">${ic('pulse', 1.8)}</span><h3>Repository health</h3></div>
          <ul class="kv"><li><span>Last commit</span><span>${ago(r.pu)}</span></li><li><span>Open issues &amp; PRs</span><span>${fmtK(r.is)}</span></li>
            <li><span>Forks</span><span>${fmtK(r.fk)}</span></li><li><span>Created</span><span>${fmtDate(r.cr)}</span></li><li><span>Archived</span><span class="${r.ar ? 'c-red' : ''}">${r.ar ? 'Yes' : 'No'}</span></li></ul></div>
      </div>
      <p class="note" style="color:var(--label2);font-size:13px;margin-top:10px">Stars show popularity, not safety. Scans read code but don't run it, and anything can change after the next commit.</p></section>

    <section class="shelf"><div class="shelf-head"><h2>Discussions<span class="sub">Real threads that link to this repository</span></h2></div>
      ${r.hn.length ? `<div class="hn-list">${r.hn.map(h => `<a class="hn" href="https://news.ycombinator.com/item?id=${h[5]}" target="_blank" rel="noopener">
        <span class="src"><span class="dotsrc" style="background:#FF6600"></span>Hacker News<span class="when">${fmtDate(h[4])}</span></span><b>${esc(h[0])}</b>
        <span class="foot"><span>${h[2]} points</span><span>${h[3]} comments</span></span></a>`).join('')}</div>`
        : `<p class="empty-note">No Hacker News threads link to this repository yet.</p>`}
      <h3 style="font-size:17px;margin-top:22px">Find videos and posts</h3>
      <div class="social-links">${SOCIAL.map(([n, c, f]) => `<a href="${f(q)}" target="_blank" rel="noopener"><span class="dotsrc" style="background:${c}"></span>${n} ${ic('ext')}</a>`).join('')}</div></section>

    <section class="shelf"><div class="shelf-head"><h2>Information</h2></div>
      <dl class="info">
        <div><dt>Publisher</dt><dd>${esc(r.on)} (${r.org ? 'organization' : 'individual'})</dd></div>
        <div><dt>Repository</dt><dd><a href="https://github.com/${l.r}" target="_blank" rel="noopener" class="mono">${esc(l.r)}</a></dd></div>
        <div><dt>Category</dt><dd>${KIND[l.k]}</dd></div>
        ${l.p ? `<div><dt>Path</dt><dd class="mono">${esc(l.p)}</dd></div>` : ''}
        <div><dt>License</dt><dd>${esc(l.lic || r.lic || 'None listed')}</dd></div>
        <div><dt>Stars</dt><dd>${r.st.toLocaleString('en-US')}</dd></div>
        <div><dt>Default branch</dt><dd class="mono">${esc(r.br)}</dd></div>
        <div><dt>Last commit</dt><dd>${fmtDate(r.pu)}</dd></div>
        <div><dt>Data fetched</dt><dd>${fmtDate(r.fd || D.gen)}</dd></div>
      </dl></section>
    ${siblings.length ? `<section class="shelf"><div class="shelf-head"><h2>More from ${esc(l.r)}</h2>${siblings.length > 8 ? `<button class="see-all" data-seeall="${l.r}">See All</button>` : ''}</div><div class="scroller tiles">${siblings.slice(0, 16).map(tile).join('')}</div></section>` : ''}
    ${dataNote()}
  </div>`;
}

// ---------- routing ----------
const S = { tab: 'today', detail: null, job: null, easy: false, q: '', agent: 'claude-code' };
try { const a = localStorage.getItem('vetted-agent'); if (AGENTS.some(x => x[0] === a)) S.agent = a; } catch (e) {}
const TABS = [['today', 'Today', 'today'], ['browse', 'Browse', 'grid'], ['tools', 'Apps', 'tool'], ['skills', 'Skills', 'skill'], ['mcp', 'Connectors', 'mcp'], ['trusted', 'Trusted', 'building'], ['search', 'Search', 'search']];
const MOBILE_TABS = ['today', 'browse', 'skills', 'mcp', 'search'];
const count = k => L.filter(l => l.k === k && !l.tr).length;
function chrome() {
  const n = { skills: L.filter(l => l.k === 'skill').length, mcp: L.filter(l => l.k === 'mcp').length, tools: L.filter(l => l.k === 'tool').length, trusted: L.filter(l => l.tr).length };
  document.getElementById('side-nav').innerHTML = TABS.filter(t => t[0] !== 'search').map(([k, l, g]) => `<button class="nav-item" data-tab="${k}" aria-current="${S.tab === k && !S.detail ? 'page' : 'false'}">${ic(g)}${l}${n[k] ? `<span class="n">${n[k]}</span>` : ''}</button>`).join('');
  document.getElementById('tabbar').innerHTML = TABS.filter(t => MOBILE_TABS.includes(t[0])).map(([k, l, g]) => `<button data-tab="${k}" aria-current="${S.tab === k ? 'page' : 'false'}">${ic(g, 1.8)}${l}</button>`).join('');
}
function render() {
  document.getElementById('main').innerHTML = S.detail ? pageProduct(S.detail) : S.job ? pageJob(S.job)
    : { today: pageToday, browse: pageBrowse, skills: pageSkills, mcp: pageMcp, tools: pageTools, trusted: pageTrusted, search: pageSearch }[S.tab]();
  chrome();
}
function route() {
  const h = decodeURIComponent(location.hash.slice(1));
  S.job = null;
  if (!BY[h]) S.back = h || 'today';
  if (BY[h]) { S.detail = h; if (!S.tab) S.tab = 'today'; }
  else if (h.startsWith('for-') && JOB[h.slice(4)]) { S.detail = null; S.job = h.slice(4); S.tab = 'browse'; }
  else { S.detail = null; S.tab = TABS.some(t => t[0] === h) ? h : 'today'; }
  render();
}
function go(tab) { if (location.hash.slice(1) === tab) route(); else location.hash = tab; }

// ---------- sheet & story ----------
const sheet = document.getElementById('sheet'), story = document.getElementById('story');
let sheetId = null;
function drawSheet() {
  const l = BY[sheetId], t = trust(l);
  document.getElementById('sheet-body').innerHTML = `<div class="sheet-bar"><span>Install</span><button class="text-btn" data-closesheet>Done</button></div>
    <div class="sheet-app">${icon(l, 60)}<div class="t"><b>${esc(l.n)}</b><span>${esc(repoOf(l).on)} · ★ ${fmtK(repoOf(l).st)}</span><span class="${t.cls}">${t.short}</span></div></div>
    <div class="group-label">Choose where to install</div>
    <p class="sheet-help">${l.k === 'skill' ? 'Use the Claude app? Pick <b>Claude app</b>: no terminal needed. ' : ''}${l.k === 'tool' ? 'Apps install from your computer\'s terminal (Terminal on Mac, PowerShell on Windows): paste the command for your system. ' : 'Claude Code, Codex and Cursor are AI coding assistants: paste the command into your terminal, or where the card says, into the assistant\'s chat. '}</p>${instCards(l)}
    <a class="pill-link" href="#${l.id}" data-closesheet style="align-self:center">View full listing</a>`;
}
function openSheet(id) { sheetId = id; drawSheet(); if (!sheet.open) sheet.showModal(); }
function openStory(id) {
  const s = stories().find(x => x.id === id);
  story.innerHTML = `<button class="close" data-closestory aria-label="Close">${ic('x', 2.6)}</button>
    <div class="hero">${art(s.g, s.glyph)}<div class="copy"><span class="eyebrow">${s.eyebrow}</span><span class="title">${s.title}</span>${s.lede ? `<span style="opacity:.85">${s.lede}</span>` : ''}</div></div>
    <div class="article">${s.body.map(p => `<p>${p}</p>`).join('')}<div class="rows">${s.apps.map(a => row(a)).join('')}</div></div>`;
  story.showModal(); story.scrollTop = 0;
}

document.addEventListener('click', e => {
  const t = e.target.closest('[data-tab],[data-get],[data-story],[data-closestory],[data-closesheet],[data-copy],[data-agent],[data-suggest],[data-seeall],[data-easy],[data-jump],[data-unclamp],.story-ov .row-txt');
  if (!t) return;
  const d = t.dataset;
  if (t.matches('.story-ov .row-txt')) { story.close(); return; }
  if (d.tab) { e.preventDefault(); go(d.tab); }
  else if (d.get) { e.preventDefault(); e.stopPropagation(); openSheet(d.get); }
  else if (d.story) openStory(d.story);
  else if ('closestory' in d) story.close();
  else if ('closesheet' in d) sheet.close();
  else if (d.copy) {
    const text = d.copy;
    const fallback = () => { const code = t.parentElement.querySelector('code'); const r = document.createRange(); r.selectNodeContents(code); const s = getSelection(); s.removeAllRanges(); s.addRange(r); toast('Selected. Press Ctrl+C or ⌘C to copy'); };
    try { navigator.clipboard.writeText(text).then(() => toast('Copied'), fallback); } catch (err) { fallback(); }
  }
  else if (d.agent) {
    S.agent = d.agent; try { localStorage.setItem('vetted-agent', S.agent); } catch (err) {}
    if (sheet.open) drawSheet();
    if (S.detail) { const y = scrollY; render(); scrollTo(0, y); }
  }
  else if (d.suggest) { S.q = d.suggest; render(); }
  else if ('unclamp' in d) { t.previousElementSibling.classList.remove('clamp'); t.remove(); }
  else if (d.jump) { document.getElementById(d.jump)?.scrollIntoView({ behavior: 'smooth', block: 'start' }); }
  else if (d.easy) { S.easy = d.easy === '1'; const y = scrollY; render(); scrollTo(0, y); }
  else if (d.seeall) { S.q = d.seeall; go('search'); }
});
document.addEventListener('input', e => {
  if (e.target.id === 'q') { S.q = e.target.value; document.getElementById('results').innerHTML = resultsHTML(); }
  if (e.target.id === 'side-q') {
    S.q = e.target.value;
    if (S.tab !== 'search' || S.detail) go('search');
    else { const r = document.getElementById('results'); if (r) r.innerHTML = resultsHTML(); }
  }
});
sheet.addEventListener('click', e => { if (e.target === sheet) sheet.close(); });
story.addEventListener('click', e => { if (e.target === story) story.close(); });
window.addEventListener('hashchange', () => { route(); window.scrollTo(0, 0); });

document.getElementById('mark').innerHTML = ic('shieldok', 2.4);
document.getElementById('side-q-ic').innerHTML = ic('search');
document.getElementById('side-foot').innerHTML = `${L.length} real listings · data from GitHub, OpenSSF and Hacker News, ${fmtDate(D.gen)}`;
route();
</script>
