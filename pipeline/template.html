:root {

     and --tint sets how strong a hover wash is. --bd-* colour the drawings of the Skillshelf bar. */

  --sidebar: rgba(255, 255, 255, 0.5); --green-ink: #1B6B31; --scrim: rgba(15, 15, 30, 0.28); --shadow: 0 30px 80px -20px rgba(20, 20, 50, 0.35); --code: rgba(255, 255, 255, 0.72);

  --k-tool: #2156D1; --k-skill: #7A3BD6; --k-mcp: #0E7A6E; --gold: #B7791F; --gold-bg: #FDF1D3; --gold-ink: #8A5300; --hl: #FCDC6A;
  --band-green: rgba(40, 170, 90, 0.09); --band-green-2: #3C5C46; --band-blue: rgba(10, 110, 230, 0.08); --band-blue-2: #42577A; --band-violet: rgba(122, 59, 214, 0.08); --band-violet-2: #574A76;

}

  --line: rgba(255, 255, 255, 0.08); --glass-hl: inset 0 1px 0 rgba(255, 255, 255, 0.07); --glass-shadow: 0 1px 2px rgba(0, 0, 0, 0.3), 0 12px 32px -16px rgba(0, 0, 0, 0.7);
  --glass-blur: blur(28px) saturate(160%); --chrome: rgba(16, 17, 22, 0.62);
  --glow: radial-gradient(55% 45% at 8% 0%, rgba(50, 100, 255, 0.22), transparent 70%), radial-gradient(45% 40% at 96% 6%, rgba(180, 90, 255, 0.14), transparent 70%),
    radial-gradient(50% 45% at 92% 96%, rgba(255, 120, 80, 0.08), transparent 70%), radial-gradient(50% 45% at 6% 98%, rgba(20, 180, 150, 0.12), transparent 70%);

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--label); font-family: var(--font); font-size: 15px; line-height: 1.4; -webkit-font-smoothing: antialiased; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--bg); }
h1, h2, h3, h4 { margin: 0; text-wrap: balance; }
p { margin: 0; text-wrap: pretty; }
::placeholder { color: var(--label2); opacity: 1; }
::selection { background: var(--hl); color: var(--label); }
html { scrollbar-color: color-mix(in srgb, var(--label) 24%, transparent) transparent; }
input, textarea { caret-color: var(--blue); }
a { color: var(--blue); text-decoration: none; }
button { font: inherit; color: inherit; cursor: pointer; border: 0; background: none; padding: 0; }
:focus-visible { outline: 2px solid var(--blue); outline-offset: 2px; border-radius: 6px; }
.mono { font-family: var(--mono); font-size: 0.9em; }
.ic { width: 1em; height: 1em; flex: none; }
.c-green { color: var(--green); } .c-orange { color: var(--orange); } .c-red { color: var(--red); } .c-blue { color: var(--blue); } .c-gray { color: var(--label2); }

/* Shell */
.shell { display: grid; grid-template-columns: 240px minmax(0, 1fr); min-height: 100%; }
.side { background: var(--sidebar); border-right: 1px solid var(--sep); padding: 18px 12px; position: sticky; top: 0; height: 100vh; display: flex; flex-direction: column; gap: 4px; }
.wordmark { display: flex; align-items: center; gap: 8px; font-weight: 700; font-size: 17px; padding: 4px 10px 12px; }
.mark { width: 26px; height: 26px; border-radius: 7px; background: linear-gradient(160deg, #3B82F6, #1D4ED8); color: #FFFFFF; display: grid; place-items: center; font-size: 15px; }
.side-search { position: relative; margin: 0 4px 10px; display: block; }
.side-search input, .search-field input { width: 100%; border: 0; background: var(--fill); color: var(--label); border-radius: 10px; padding: 8px 10px 8px 32px; font: inherit; }
.side-search .ic, .search-field .ic { position: absolute; left: 10px; top: 50%; transform: translateY(-50%); color: var(--label2); font-size: 15px; }
.nav-item { display: flex; align-items: center; gap: 10px; padding: 7px 10px; border-radius: 8px; color: var(--label); font-size: 15px; font-weight: 500; width: 100%; text-align: left; }
.nav-item .ic { color: color-mix(in oklab, var(--c, var(--blue)), #FFFFFF var(--lift)); font-size: 18px; }
.nav-item:hover { background: color-mix(in srgb, var(--fill) 60%, transparent); }
.nav-item[aria-current="page"] { background: var(--card); box-shadow: 0 0 0 1px var(--line), 0 1px 3px rgba(40, 30, 20, 0.08); }
.nav-item .n { margin-left: auto; color: var(--label2); font-size: 13px; font-variant-numeric: tabular-nums; }
.side-foot { margin-top: auto; padding: 10px; font-size: 12px; color: var(--label2); line-height: 1.45; }
.tabbar { display: none; }
.main { min-width: 0; }
.page { max-width: 1120px; margin: 0 auto; padding-block: 28px 60px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
@media (min-width: 761px) { .page { padding-left: 36px; padding-right: 36px; } }
.date-eyebrow { font-size: 13px; font-weight: 600; color: var(--label2); text-transform: uppercase; letter-spacing: 0.02em; }
.large-title { margin-bottom: 18px; }
.large-title h1 { font-size: 34px; font-weight: 700; letter-spacing: 0.01em; }
.large-title p { color: var(--label2); font-size: 15px; margin-top: 4px; max-width: 70ch; }
.large-title .intro { font-size: 17px; line-height: 1.45; color: var(--label); max-width: 62ch; margin-top: 6px; }
.intro-links { display: flex; gap: 16px; flex-wrap: wrap; margin-top: 8px; }
.intro-links a, .intro-links button { color: var(--blue); font-size: 15px; font-weight: 600; }
.data-note { margin-top: 40px; font-size: 12px; color: var(--label2); border-top: 1px solid var(--sep); padding-top: 14px; max-width: 80ch; line-height: 1.5; }

/* Today */
.today { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 26px; }
.story { position: relative; border-radius: 18px; overflow: hidden; aspect-ratio: 4 / 3; max-width: 100%; box-shadow: var(--shadow); color: #FFFFFF; text-align: left; display: flex; flex-direction: column; transition: transform .25s cubic-bezier(.2,.8,.2,1); width: 100%; }
.story:hover { transform: scale(0.99); }
.story:active { transform: scale(0.97); }
.story .art { position: absolute; inset: 0; }
.story .copy { position: relative; padding: 20px 20px 0; display: flex; flex-direction: column; gap: 4px; }
.story .eyebrow { font-size: 13px; font-weight: 600; text-transform: uppercase; opacity: 0.8; letter-spacing: 0.02em; }
.story .title { font-size: 28px; font-weight: 800; line-height: 1.08; letter-spacing: -0.01em; max-width: 16ch; }
.story .bottom { position: relative; margin-top: auto; padding: 0 20px 20px; font-size: 15px; opacity: .9; }
.story .bottom.frost { opacity: 1; padding: 12px 16px; background: rgba(255,255,255,.16); backdrop-filter: blur(20px) saturate(1.4); -webkit-backdrop-filter: blur(20px) saturate(1.4); display: flex; align-items: center; gap: 12px; }
.story .bottom.frost .t { flex: 1; min-width: 0; }
.story .bottom.frost b { display: block; font-size: 15px; }
.story .bottom.frost .t span { font-size: 13px; opacity: .85; display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.story.wide { grid-column: 1 / -1; aspect-ratio: 2.6 / 1; }
.story.wide .title { font-size: 40px; max-width: 14ch; }
.glyph-art { position: absolute; right: -6%; bottom: 12%; width: 62%; aspect-ratio: 1; opacity: 0.2; color: #FFFFFF; }
.story.wide .glyph-art { width: 34%; right: 4%; bottom: -4%; }
.orb { position: absolute; border-radius: 50%; }
.stat-big { font-size: 64px; font-weight: 800; line-height: 1; letter-spacing: -0.02em; }

/* Shelves */
.shelf { margin-top: 34px; }
.shelf-head { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; border-top: 1px solid var(--sep); padding-top: 14px; margin-bottom: 12px; }
.shelf-head h2 { font-size: 22px; font-weight: 700; flex: 1 1 auto; min-width: 0; }
.shelf-head .sub { color: var(--label2); font-size: 15px; display: block; font-weight: 400; margin-top: 2px; }
.see-all { font-size: 17px; white-space: nowrap; color: var(--blue); }
.scroller { display: grid; grid-auto-flow: column; gap: 18px; overflow-x: auto; scroll-snap-type: x mandatory; scrollbar-width: none; padding-bottom: 4px; }
.scroller::-webkit-scrollbar { display: none; }
.scroller > * { scroll-snap-align: start; }
.banners { grid-auto-columns: minmax(0, calc((100% - 18px) / 2)); }
.banner { display: flex; flex-direction: column; gap: 3px; text-align: left; min-width: 0; color: var(--label); }
.banner .eb { font-size: 12px; font-weight: 600; color: var(--blue); text-transform: uppercase; letter-spacing: 0.02em; }
.banner .bt { font-size: 21px; font-weight: 600; }
.banner .bs { font-size: 16px; color: var(--label2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.banner .bart { margin-top: 8px; border-radius: 12px; aspect-ratio: 16 / 9; max-width: 100%; position: relative; overflow: hidden; display: flex; align-items: flex-end; padding: 16px; color: #FFFFFF; }
.banner .bart .bline { position: relative; display: flex; align-items: center; gap: 10px; font-size: 14px; font-weight: 600; }
.ranked { grid-template-rows: repeat(3, auto); grid-auto-columns: minmax(300px, calc((100% - 36px) / 3)); column-gap: 18px; row-gap: 0; }
.ranked.two { grid-template-rows: repeat(2, auto); }
.ranked.one { grid-template-rows: auto; }
.tiles { grid-auto-columns: 118px; }
.tile { display: flex; flex-direction: column; gap: 6px; text-align: left; color: var(--label); min-width: 0; }
.tile .icon { width: 118px; height: 118px; }
.tile b { font-size: 14px; font-weight: 500; display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tile span { font-size: 12px; color: var(--label2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

/* Icons */
.icon { flex: none; border-radius: 22.5%; display: grid; place-items: center; color: #FFFFFF; position: relative; overflow: hidden; box-shadow: inset 0 0 0 0.5px rgba(0,0,0,.14); background: var(--fill); }
.icon::after { content: ""; position: absolute; inset: 0; background: linear-gradient(180deg, rgba(255,255,255,.2), rgba(255,255,255,0) 55%); pointer-events: none; }
.icon > svg { width: 50%; height: 50%; }
.icon > img { width: 100%; height: 100%; object-fit: cover; display: block; }
.icon .av { position: absolute; right: 6%; bottom: 6%; width: 34%; height: 34%; border-radius: 28%; background: #FFFFFF; box-shadow: 0 1px 4px rgba(0,0,0,.3); overflow: hidden; z-index: 1; }
.icon .av img { width: 100%; height: 100%; display: block; }

/* Rows */
.row { display: flex; align-items: center; gap: 12px; padding: 10px 0; min-width: 0; }
.row .rank { width: 18px; font-size: 17px; font-weight: 600; text-align: center; flex: none; }
.row-body { flex: 1; min-width: 0; display: flex; align-items: center; gap: 12px; align-self: stretch; border-bottom: 1px solid var(--sep); padding-block: 6px; }
.ranked .row:nth-child(3n) .row-body, .ranked.two .row:nth-child(2n) .row-body, .ranked.one .row-body { border-bottom: 0; }
.ranked.two .row:nth-child(3n) .row-body { border-bottom: 1px solid var(--sep); }
.ranked.two .row:nth-child(6n) .row-body { border-bottom: 0; }
.row-txt { flex: 1; min-width: 0; text-align: left; }
.row-txt b { display: block; font-size: 16px; font-weight: 500; color: var(--label); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.row-txt span { display: block; font-size: 13px; color: var(--label2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.btn-col { display: flex; flex-direction: column; align-items: center; gap: 3px; flex: none; }
.iap { font-size: 10px; color: var(--label2); white-space: nowrap; display: inline-flex; align-items: center; gap: 2px; }
.get { min-width: 76px; height: 30px; border-radius: 15px; background: var(--fill); color: var(--blue); font-size: 15px; font-weight: 700; letter-spacing: 0.02em; padding: 0 16px; display: inline-grid; place-items: center; }
.get.primary { background: var(--btn); color: #FFFFFF; }
.get.light { background: #FFFFFF; color: #007AFF; }
.pill-link { display: inline-flex; align-items: center; gap: 6px; height: 30px; padding: 0 14px; border-radius: 15px; background: var(--fill); color: var(--blue); font-weight: 600; font-size: 14px; }

/* Product page */
.navbar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: color-mix(in srgb, var(--bg) 82%, transparent); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); }
.navbar .in { max-width: 1120px; margin: 0 auto; display: flex; align-items: center; gap: 10px; padding-block: 10px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
@media (min-width: 761px) { .navbar .in { padding-left: 36px; padding-right: 36px; } }
.back { display: inline-flex; align-items: center; gap: 2px; color: var(--blue); font-size: 17px; }
.back .ic { font-size: 22px; }
.product-head { display: flex; gap: 20px; align-items: flex-start; }
.product-head .icon { width: 128px; height: 128px; }
.product-head .txt { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; min-height: 128px; }
.product-head h1 { font-size: 26px; font-weight: 700; overflow-wrap: anywhere; }
.product-head .sub { font-size: 17px; color: var(--label2); }
.product-head .acts { margin-top: auto; display: flex; align-items: center; gap: 10px; padding-top: 12px; flex-wrap: wrap; }
.strip { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(118px, 1fr); overflow-x: auto; scrollbar-width: none; margin-top: 22px; border-block: 1px solid var(--sep); padding-block: 12px; }
.strip::-webkit-scrollbar { display: none; }
.strip > div { text-align: center; padding: 0 10px; border-left: 1px solid var(--sep); display: flex; flex-direction: column; align-items: center; gap: 2px; min-width: 0; }
.strip > div:first-child { border-left: 0; }
.strip .k { font-size: 11px; font-weight: 600; color: var(--label2); text-transform: uppercase; letter-spacing: 0.02em; white-space: nowrap; }
.strip .v { font-size: 20px; font-weight: 700; color: var(--label2); display: flex; align-items: center; gap: 4px; white-space: nowrap; font-variant-numeric: tabular-nums; }
.strip .v.c-green { color: var(--green); } .strip .v.c-blue { color: var(--blue); }
.strip .c { font-size: 12px; color: var(--label2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100%; }
.desc { margin-top: 26px; display: grid; grid-template-columns: minmax(0, 1fr) 260px; gap: 30px; }
.desc p { font-size: 15px; line-height: 1.55; max-width: 68ch; overflow-wrap: anywhere; }
.desc > div { min-width: 0; }
.desc p.clamp { display: -webkit-box; -webkit-line-clamp: 5; -webkit-box-orient: vertical; overflow: hidden; }
.desc .more { color: var(--blue); font-size: 15px; font-weight: 600; margin-top: 4px; }
.desc .lbl { display: block; font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .03em; color: var(--label2); margin-bottom: 4px; }
.desc .dev a { font-size: 15px; display: block; overflow-wrap: anywhere; }
.desc .dev span { font-size: 13px; color: var(--label2); display: block; }
.desc .dev > div + div { margin-top: 12px; }

/* Install blocks */
.inst-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 14px; }
.inst-card { background: var(--bg2); border-radius: 14px; padding: 14px 16px; display: flex; flex-direction: column; gap: 10px; min-width: 0; }
.sheet .inst-card { background: var(--card); }
.inst-card .h { display: flex; align-items: center; gap: 8px; }
.inst-card .h b { font-size: 16px; }
.inst-card .how { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .03em; color: var(--label2); background: var(--fill); padding: 2px 7px; border-radius: 5px; }
.inst-card .note { font-size: 13px; color: var(--label2); }
.inst-card.scan { background: color-mix(in srgb, var(--green) 10%, var(--bg2)); }
.sheet .inst-card.scan { background: color-mix(in srgb, var(--green) 10%, var(--card)); }
.copybox { display: flex; gap: 8px; align-items: center; background: var(--code); border: 1px solid var(--sep); border-radius: 10px; padding: 8px 8px 8px 12px; min-width: 0; }

.dev-scan { margin-top: 4px; }
.inst-card.ask { background: var(--band-blue); }
.claude-steps { margin: 0; padding-left: 20px; display: grid; gap: 8px; line-height: 1.45; }
.claude-steps .copybox { margin-top: 6px; }
.claude-tries { margin: 6px 0 0; padding-left: 18px; display: grid; gap: 4px; color: var(--label2); }
.claude-desk { display: grid; gap: 6px; justify-items: start; border-top: 1px solid var(--sep); padding-top: 12px; line-height: 1.45; }
.bar-card { justify-items: start; }
.bar-card .pill-link { align-self: flex-start; }
/* A drawing of the Skills bar above Claude Code's message box: fixed light colours, like a picture of the app */
.bar-drawing { background: #FFFFFF; color: #1F1F1F; border: 1px solid var(--sep); border-radius: 12px; padding: 12px; display: grid; gap: 10px; font-size: 13.5px; line-height: 1.3; }
.bd-bar { background: #F3F3F3; border-radius: 9px; padding: 8px; display: grid; gap: 8px; }
.bd-chips { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.bd-tog { padding: 0 4px; }
.bd-chip { background: #1F1F1F; color: #FFFFFF; font-weight: 700; border-radius: 6px; padding: 4px 8px; white-space: nowrap; }
.bd-chip.off, .bd-chip.all { background: #E4E4E4; color: #1F1F1F; font-weight: 400; }
.bd-links { display: flex; gap: 16px; color: #6B6B6B; padding: 0 4px; }
.bd-composer { border: 1px solid #D6D6D6; border-radius: 12px; padding: 10px 12px; display: flex; gap: 10px; color: #6B6B6B; }
.bd-composer .ph { flex: 1; }
.bd-composer span:first-child, .bd-composer span:last-child { color: #1F1F1F; }
.claude-note { margin: 0; font-size: 12.5px; color: var(--label2); line-height: 1.45; }
.sheet .inst-card.ask { background: var(--band-blue); }
.ask-btns { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }

.ask-q { flex-basis: 100%; }
.ask-q > summary { cursor: pointer; color: var(--label2); font-size: 13px; padding: 2px 0; }
.ask-q[open] > summary { margin-bottom: 6px; }
/* Focus: a viewer's own setup */
.side-tailor { display: flex; align-items: center; gap: 10px; margin: 0 4px 10px; padding: 9px 12px; border-radius: 10px; background: color-mix(in srgb, var(--blue) 12%, var(--bg2)); color: var(--blue); font-weight: 600; font-size: 15px; text-align: left; }
.side-tailor .ic { font-size: 18px; }
.side-tailor small { display: block; font-weight: 400; font-size: 12px; color: var(--label2); }
.fab { display: none; }
.focusbar { max-width: 1120px; margin: 0 auto; padding: 12px max(16px, env(safe-area-inset-right, 0px)) 0 max(16px, env(safe-area-inset-left, 0px)); }
@media (min-width: 761px) { .focusbar { padding: 18px 36px 0; } }
.focusbar .in { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 14px; background: color-mix(in srgb, var(--blue) 9%, var(--bg2)); border-radius: 12px; padding: 10px 14px; font-size: 14px; }
.focusbar .fb-t { flex: 1 1 220px; min-width: 0; }
.focusbar .fb-t span { color: var(--label2); }
.focusbar button { color: var(--blue); font-weight: 600; font-size: 14px; }
dialog.panel { background: var(--bg); width: min(420px, 100vw); height: 100dvh; max-height: 100dvh; margin: 0 0 0 auto; border-radius: 0; box-shadow: var(--shadow); overflow-y: auto; }
dialog.panel[open] { animation: panelIn .28s cubic-bezier(.2,.8,.2,1); }
@keyframes panelIn { from { transform: translateX(40px); opacity: 0; } }
.panel-in { padding: 16px 18px 0; display: flex; flex-direction: column; gap: 18px; }
.panel-bar { display: flex; justify-content: space-between; align-items: center; }
.panel-bar b { font-size: 21px; }
.panel-sub { font-size: 14px; color: var(--label2); margin-top: -10px; }
.pgroup h3 { font-size: 15px; margin-bottom: 8px; }
.pchips { display: flex; flex-wrap: wrap; gap: 8px; }
.pchip { padding: 7px 12px; border-radius: 12px; background: var(--fill); font-size: 14px; font-weight: 600; color: var(--label); border: 1.5px solid transparent; text-align: left; }
.pchip small { display: block; font-weight: 400; color: var(--label2); font-size: 12px; }
.pchip[aria-pressed="true"] { background: color-mix(in srgb, var(--blue) 13%, var(--bg)); border-color: var(--blue); color: var(--blue); }
.panel-foot { position: sticky; bottom: 0; background: var(--bg); padding: 12px 0 calc(16px + env(safe-area-inset-bottom, 0px)); display: flex; align-items: center; gap: 12px; border-top: 1px solid var(--sep); }

.panel-foot .text-btn { font-size: 15px; }
.shelf:has(> .scroller.ranked:empty), .shelf:has(> .picks:empty), .shelf:has(> .rowlist:empty), .shelf:has(> .scroller.tiles:empty) { display: none; }
@media (max-width: 760px) {
  .fab { display: inline-flex; position: fixed; right: 16px; bottom: calc(74px + env(safe-area-inset-bottom, 0px)); z-index: 24; align-items: center; gap: 6px; height: 40px; padding: 0 14px; border-radius: 999px; background: var(--blue); color: #FFFFFF; font-weight: 700; font-size: 14px; box-shadow: var(--shadow); transition: transform .25s ease, opacity .25s ease; }
  .fab .ic { width: 18px; height: 18px; }

  dialog.panel { width: 100vw; height: auto; max-height: 92dvh; margin: auto 0 0; border-radius: 14px 14px 0 0; }
  dialog.panel[open] { animation: sheetUp .32s cubic-bezier(.2,.8,.2,1); }
}
/* Tested */
.test-hero { background: #16120F; }
.test-hero .shot { position: absolute; top: 0; bottom: 0; right: 0; left: 40%; background-size: cover; background-position: left top; }
.test-hero .shade { position: absolute; inset: 0; background: linear-gradient(90deg, #16120F 0%, #16120F 40%, rgba(22,18,15,.55) 52%, rgba(22,18,15,0) 70%); }
.test-hero .title { max-width: 18ch; text-shadow: 0 1px 12px rgba(0,0,0,.35); }
a.tested-box { display: flex; flex-direction: column; align-items: flex-start; gap: 4px; margin-top: 12px; padding: 14px 16px; border-radius: 14px; border: 1px solid var(--sep); background: var(--card); color: var(--label); }
.tested-box.pick { border-color: var(--green); background: color-mix(in srgb, var(--green) 7%, var(--card)); }
.tested-box.skip { border-color: var(--orange); }
.tested-box span { font-size: 14px; color: var(--label2); } .tested-box b { font-size: 16px; }
.tested-box .tb-link { color: var(--blue); font-weight: 600; }
.verdict-box { margin: 6px 0 8px; padding: 18px; border-radius: 16px; background: color-mix(in srgb, var(--green) 7%, var(--bg2)); }
.verdict-box h2 { font-size: 20px; margin: 0 0 6px; } .verdict-box > p { margin: 0 0 8px; line-height: 1.5; }
.verdict-box .note { font-size: 13px; color: var(--label2); }
.vb-pick .lbl { display: block; margin-top: 8px; }
.score-table .sc-cell { white-space: nowrap; } .score-table tr.win td { background: color-mix(in srgb, var(--green) 8%, transparent); }
.sbar { display: inline-block; width: 70px; height: 6px; border-radius: 3px; background: var(--fill); vertical-align: middle; margin-right: 6px; overflow: hidden; }
.sbar i { display: block; height: 100%; background: var(--blue); } .snum { font-variant-numeric: tabular-nums; font-weight: 600; }
.test-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 18px; }
.test-card { margin: 0; border: 1px solid var(--sep); border-radius: 14px; overflow: hidden; background: var(--card); }
.test-card.win { border: 2px solid var(--green); }
.test-card .shots { position: relative; display: block; aspect-ratio: 16 / 10; overflow: hidden; background: var(--bg2); }
.test-card .shots img { width: 100%; display: block; }
.test-card .shots .ph { position: absolute; right: 8px; bottom: 8px; width: 22%; border-radius: 8px; box-shadow: 0 4px 16px rgba(0,0,0,.25); border: 2px solid #FFFFFF; }
.test-card figcaption { padding: 12px 14px; display: grid; gap: 6px; }
.test-card .tc-h { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.test-card .sc { font-weight: 800; font-size: 18px; font-variant-numeric: tabular-nums; }
.test-card p { margin: 0; font-size: 13px; color: var(--label2); line-height: 1.45; } .test-card small { font-size: 12px; color: var(--label2); }
.method { padding-left: 18px; display: grid; gap: 8px; font-size: 14px; line-height: 1.5; }
.tests { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 18px; }
.test-tile { display: block; border-radius: 16px; overflow: hidden; border: 1px solid var(--sep); background: var(--card); color: var(--label); }
.test-tile .shot { display: block; aspect-ratio: 16 / 9; background-size: cover; background-position: top center; }
.test-tile .tt-body { display: grid; gap: 4px; padding: 14px 16px; } .test-tile b { font-size: 18px; } .test-tile .tt-body > span:last-child { font-size: 14px; color: var(--label2); }

#install-all .note { display: block; font-size: 13px; color: var(--label2); margin: 8px 0 0; line-height: 1.45; }
.hidden-note .text-btn { font-size: 14px; }
.home-search { display: flex; align-items: center; gap: 10px; margin: 0 0 12px; padding: 14px 16px; border-radius: 14px; background: var(--fill); color: var(--label2); font-size: 16px; font-weight: 500; }
.home-search .ic { flex: none; }
.tested-line { display: flex; align-items: flex-start; gap: 10px; margin-top: 22px; padding: 12px 14px; border-radius: 12px; border: 1px solid var(--sep); color: var(--label); font-size: 14px; line-height: 1.5; }
.tested-line .ic { flex: none; color: var(--green); margin-top: 3px; }
/* My list, compare, install all */
.list-acts { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-top: 12px; }
.pill-link.save[aria-pressed="true"] { color: var(--red); }
.copybox.multi { align-items: flex-start; }
.audit-opt { display: flex; gap: 8px; align-items: flex-start; margin-top: 10px; font-size: 14px; color: var(--label); line-height: 1.4; }

.copybox.multi code { max-height: 220px; overflow: auto; }

.try { margin: 12px 0 0; display: flex; flex-wrap: wrap; gap: 6px; align-items: baseline; }

.tabbar button { position: relative; }

@media (max-width: 760px) {
  .test-hero .shot { left: 0; top: 46%; }

  .caught-grid { grid-template-columns: 1fr; }

}
/* Digest */
.issues { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px; }
.scroller.issues { display: grid; grid-auto-flow: column; grid-template-columns: none; grid-auto-columns: minmax(260px, calc((100% - 32px) / 3)); }
.issue-card { position: relative; border-radius: 16px; overflow: hidden; color: #FFFFFF; padding: 18px; min-height: 196px; display: flex; flex-direction: column; gap: 4px; text-align: left; box-shadow: var(--shadow); }
.issue-card .art, .issue-hero .art { position: absolute; inset: 0; }
.issue-card .ey, .issue-hero .ey { position: relative; font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: .03em; opacity: .85; }
.issue-card .tt { position: relative; font-size: 22px; font-weight: 800; line-height: 1.12; }
.issue-card .ft { position: relative; margin-top: auto; display: flex; align-items: center; gap: 6px; font-size: 13px; }
.issue-card .ft .icon { width: 30px; height: 30px; }
.issue-card .ft span { margin-left: 4px; opacity: .9; }
.issue-hero { position: relative; overflow: hidden; border-radius: 18px; color: #FFFFFF; padding: 26px 22px; margin-bottom: 16px; display: flex; flex-direction: column; gap: 6px; }
.issue-hero h1 { position: relative; font-size: 32px; font-weight: 800; line-height: 1.08; color: #FFFFFF; max-width: 18ch; }
.issue-intro { font-size: 17px; line-height: 1.5; max-width: 64ch; }
.picks { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); column-gap: 30px; }
.pick { display: grid; grid-template-columns: 22px auto minmax(0, 1fr) auto; gap: 12px; align-items: center; padding: 12px 0; border-bottom: 1px solid var(--sep); min-width: 0; }
.pk-n { font-size: 17px; font-weight: 700; text-align: center; color: var(--label2); }
.pk-t { display: flex; flex-direction: column; min-width: 0; text-align: left; color: var(--label); gap: 1px; }
.pk-t b { font-size: 16px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.pk-m { font-size: 13px; font-weight: 700; color: var(--green); }
.pk-d { font-size: 13px; color: var(--label2); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.past { list-style: none; margin: 0; padding: 0; }
.past li a { display: flex; justify-content: space-between; gap: 12px; padding: 12px 0; border-bottom: 1px solid var(--sep); color: var(--label); }
.past li span { color: var(--label2); font-size: 14px; }
@media (max-width: 760px) { .issues { grid-template-columns: minmax(0, 1fr); } .scroller.issues { grid-auto-columns: 82%; } .picks { grid-template-columns: minmax(0, 1fr); } .issue-hero h1 { font-size: 28px; } }
details.full { margin-top: 30px; border-top: 1px solid var(--sep); }
details.full > summary { list-style: none; cursor: pointer; display: flex; flex-direction: column; gap: 2px; padding: 16px 0 4px; }
details.full > summary::-webkit-details-marker { display: none; }

.inst-grid > .dev-scan { grid-column: 1 / -1; }

.copy-btn { flex: none; width: 30px; height: 30px; border-radius: 8px; display: grid; place-items: center; color: var(--blue); font-size: 16px; }

.seg { display: inline-flex; background: var(--fill); border-radius: 9px; padding: 2px; gap: 2px; flex-wrap: wrap; }

.seg button[aria-pressed="true"] { background: var(--card); color: var(--label); box-shadow: 0 1px 3px rgba(0,0,0,.12); }

  background: conic-gradient(currentColor calc(var(--p) * 1%), var(--fill) 0); }

.fh { display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; }
.fh b { font-size: 15px; }
.sev { font-size: 11px; font-weight: 800; letter-spacing: .03em; }
.pid { color: var(--label3); font-size: 12px; margin-left: auto; }
.pat { font-size: 13.5px; }
.loc { font-size: 12px; overflow-wrap: anywhere; }
.snip { display: block; font-family: var(--mono); font-size: 12px; background: var(--code); border: 1px solid var(--sep); border-radius: 8px; padding: 6px 10px; overflow-x: auto; white-space: pre; }
.fd .why { font-size: 13px; color: var(--label2); }
/* Review notes cite file paths and code that have no break points */
#main p, #main li, .sheet-in p, .article p { overflow-wrap: break-word; }
.fd .ours, .fd .why, .cap p, .tools li p, .worth p { overflow-wrap: anywhere; }
.fd .ours { font-size: 14px; color: var(--label); line-height: 1.45; }
.fd .ours span { font-weight: 700; }
.fd .also { font-size: 12.5px; color: var(--label2); align-self: center; }
.fh .chip { align-self: center; }
.rv { background: var(--bg2); border-radius: 14px; padding: 16px; }
.rv-h { font-size: 18px; font-weight: 700; }
.rv-list { list-style: none; margin: 10px 0 0; padding: 0; display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 10px 20px; }
.rv-list li { display: grid; grid-template-columns: 3.4ch minmax(0, 1fr); gap: 10px; align-items: baseline; font-size: 14px; color: var(--label2); line-height: 1.4; }
.rv-list b { font-size: 21px; font-weight: 800; color: var(--label); font-variant-numeric: tabular-nums; text-align: right; }
.raw { margin-top: 10px; display: flex; flex-wrap: wrap; gap: 4px 18px; align-items: baseline; font-size: 13px; color: var(--label2); border: 1px solid var(--sep); border-radius: 12px; padding: 10px 14px; }
.raw > span:first-child { flex-basis: 100%; font-weight: 600; color: var(--label2); }
.raw b { color: var(--label); font-weight: 600; }
@media (max-width: 1000px) { .rep { grid-template-columns: minmax(0, 1fr); } }

.uses { margin-top: 12px; }
.uses ul { list-style: none; margin: 6px 0 0; padding: 0; display: grid; grid-template-columns: max-content 1fr; gap: 6px 14px; }
.uses li { display: contents; font-size: 14px; }
.uses li b { font-weight: 600; font-size: 14px; color: var(--label); }
.uses li span { font-size: 14px; color: var(--label2); }
.plain .also-chk, .also-chk { margin: 8px 0 0; font-size: 13px; line-height: 1.4; color: var(--label2); }
.also-chk .text-btn { font-size: 13px; }
.row-txt .by { display: flex; align-items: center; gap: 3px; font-style: normal; font-size: 12px; color: var(--label2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: 1px; }
.row-txt .by .ic { width: 11px; height: 11px; flex: none; }
.raw-d { margin-top: 12px; }
.sheet-note { display: flex; gap: 10px; align-items: flex-start; padding: 12px 14px; border-radius: 12px; background: var(--fill); font-size: 14px; color: var(--label); }
.sheet-note p { margin: 0; } .sheet-note .ic { flex: none; color: var(--blue); margin-top: 2px; }
.ver-note { margin: 4px 2px 0; font-size: 12px; color: var(--label2); }
.raw-d > summary { cursor: pointer; font-size: 13px; color: var(--label2); font-weight: 600; }
/* Trusted publisher */
.trusted-note { display: flex; gap: 14px; align-items: flex-start; background: color-mix(in srgb, var(--blue) 9%, var(--bg2)); border-radius: 14px; padding: 16px; }
.trusted-note > .ic { font-size: 30px; color: var(--blue); flex: none; }
.trusted-note b { font-size: 18px; display: block; }
.trusted-note p { color: var(--label2); font-size: 14px; margin-top: 2px; max-width: 75ch; }
.scan-anyway { margin-top: 14px; }
.scan-anyway > summary { cursor: pointer; color: var(--blue); font-size: 15px; font-weight: 600; padding: 6px 0; }
.scan-anyway[open] > summary { margin-bottom: 4px; }

.worth { margin-top: 12px; background: color-mix(in srgb, var(--orange) 10%, var(--bg2)); border-radius: 14px; padding: 14px 16px; display: flex; flex-direction: column; gap: 6px; }
.worth.lv-note { background: var(--band-blue); }
.worth.lv-warn { background: color-mix(in srgb, var(--orange) 13%, var(--bg2)); }
.worth.lv-bad { background: color-mix(in srgb, var(--red) 13%, var(--bg2)); }
.worth:first-of-type { margin-top: 0; }
.worth b { font-size: 16px; }
.worth p { font-size: 14px; color: var(--label2); line-height: 1.5; max-width: 80ch; }
.ev-row { display: flex; gap: 6px; flex-wrap: wrap; }

/* Purpose check */
.pc-verdict { display: flex; gap: 14px; align-items: flex-start; background: var(--bg2); border-radius: 14px; padding: 16px; }
.pc-verdict > .ic { font-size: 34px; flex: none; }
.pc-verdict b { font-size: 19px; display: block; }
.pc-verdict p { color: var(--label2); font-size: 14px; margin-top: 2px; }
.pc-verdict .purpose { color: var(--label); margin-top: 8px; }
.pc-verdict .purpose span { display: block; font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .03em; color: var(--label2); }
.pc-grid { display: grid; grid-template-columns: minmax(0, 1.2fr) minmax(0, 1fr); gap: 14px; margin-top: 14px; align-items: start; }
.pc-side { display: flex; flex-direction: column; gap: 14px; min-width: 0; }
.pc-card { background: var(--bg2); border-radius: 14px; padding: 16px; min-width: 0; display: flex; flex-direction: column; gap: 8px; }
.pc-card h3 { font-size: 16px; font-weight: 600; }
.pc-sub { font-size: 13.5px; color: var(--label2); line-height: 1.45; }
.pc-card .score { font-size: 30px; font-weight: 800; font-variant-numeric: tabular-nums; }
.pc-card .score small { font-size: 13px; color: var(--label2); font-weight: 600; }
.caps { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; }
.cap { padding: 10px 0; border-top: 1px solid var(--sep); display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.cap:first-child { border-top: 0; }
.cap-h { display: flex; justify-content: space-between; gap: 8px; align-items: center; }
.cap-h b { font-size: 14.5px; font-weight: 600; }
.cap p { font-size: 13px; color: var(--label2); }
.chip { font-size: 11px; font-weight: 700; padding: 2px 8px; border-radius: 999px; background: var(--fill); white-space: nowrap; }
.ev { display: flex; flex-direction: column; gap: 2px; font-size: 11.5px; background: var(--code); border: 1px solid var(--sep); border-radius: 8px; padding: 6px 8px; min-width: 0; }
.ev code { color: var(--label2); overflow-x: auto; white-space: pre; font-family: var(--mono); }
.ev { max-width: 100%; } .ev span { overflow-wrap: anywhere; }
.cap-h b { overflow-wrap: anywhere; min-width: 0; }
.tools summary { cursor: pointer; color: var(--blue); font-size: 14px; font-weight: 600; }
.tools ul { list-style: none; margin: 8px 0 0; padding: 0; max-height: 320px; overflow-y: auto; }
.tools li { padding: 6px 0; border-top: 1px solid var(--sep); font-size: 13px; }
.tools li p { color: var(--label2); font-size: 12.5px; margin-top: 2px; }
.stack { display: flex; height: 10px; border-radius: 5px; overflow: hidden; background: var(--fill); gap: 2px; }
.stack i { display: block; height: 100%; min-width: 3px; }
.legend { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 4px 12px; font-size: 13px; color: var(--label2); }
.legend li { display: flex; align-items: center; gap: 6px; }
.legend b { margin-left: auto; color: var(--label); font-variant-numeric: tabular-nums; }
@media (max-width: 1000px) { .pc-grid { grid-template-columns: minmax(0, 1fr); } }

/* Discussions */
.hn-list { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 14px; }
.hn { background: var(--bg2); border-radius: 12px; padding: 14px 16px; display: flex; flex-direction: column; gap: 8px; min-width: 0; color: var(--label); }
.hn .src { display: flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 700; }
.hn .src .when { margin-left: auto; font-weight: 400; color: var(--label2); }
.hn b { font-size: 15px; line-height: 1.3; }
.hn .foot { display: flex; gap: 12px; font-size: 12.5px; color: var(--label2); margin-top: auto; flex-wrap: wrap; }
.dotsrc { width: 8px; height: 8px; border-radius: 50%; display: inline-block; flex: none; }
.social-links { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 14px; }
.social-links a { display: inline-flex; align-items: center; gap: 7px; padding: 8px 14px; border-radius: 999px; background: var(--bg2); color: var(--label); font-size: 14px; font-weight: 600; }
.social-links a .ic { color: var(--label2); font-size: 13px; }
.empty-note { color: var(--label2); font-size: 14px; background: var(--bg2); border-radius: 12px; padding: 14px 16px; }

.info { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); column-gap: 30px; margin: 0; }
.info div { padding: 10px 0; border-bottom: 1px solid var(--sep); min-width: 0; }
.info dt { font-size: 13px; color: var(--label2); }
.info dd { margin: 2px 0 0; font-size: 15px; overflow-wrap: anywhere; }

/* Plain words, setup level, jobs */
.plain { margin-top: 18px; background: color-mix(in srgb, var(--blue) 8%, var(--bg2)); border-radius: 14px; padding: 14px 16px; display: flex; gap: 12px; align-items: flex-start; }
.plain > .ic { font-size: 22px; color: var(--blue); margin-top: 2px; }
.plain .check { margin-top: 10px; font-size: 14.5px; display: grid; grid-template-columns: auto minmax(0, 1fr); column-gap: 6px; row-gap: 2px; align-items: start; }
.plain .check .ic { margin-top: 3px; }
.plain .check button { justify-self: start; }
.plain .check b { font-weight: 700; }
.plain .check .vsub { grid-column: 2; font-size: 14px; color: var(--label2); line-height: 1.45; }
.plain .check .vbtns { grid-column: 2; display: flex; column-gap: 14px; row-gap: 2px; flex-wrap: wrap; margin-top: 2px; }
.plain .check button { color: var(--blue); font-size: 14px; font-weight: 600; }
.plain .lbl { display: block; font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .03em; color: var(--label2); }
.plain p { font-size: 17px; line-height: 1.4; margin-top: 2px; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
.chips a, .chips span { font-size: 12.5px; font-weight: 600; padding: 4px 10px; border-radius: 999px; background: var(--card); color: var(--label); border: 1px solid var(--sep); }
.chips .lv1 { color: var(--green); } .chips .lv2 { color: var(--blue); } .chips .lv3 { color: var(--orange); }
.job-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 12px; }
.job-card { display: flex; gap: 12px; align-items: center; background: var(--bg2); border-radius: 14px; padding: 14px; color: var(--label); min-width: 0; text-align: left; }
.job-card .jg { width: 44px; height: 44px; border-radius: 12px; display: grid; place-items: center; color: #FFFFFF; flex: none; font-size: 22px; }
.job-card b { display: block; font-size: 16px; }
.job-card span.s { display: block; font-size: 13px; color: var(--label2); }
.job-card .n { margin-left: auto; color: var(--label2); font-size: 13px; font-variant-numeric: tabular-nums; flex: none; }
.start { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px; }
.start a { background: var(--bg2); border-radius: 14px; padding: 16px; color: var(--label); display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.start a .ic { font-size: 26px; color: var(--blue); }
.start a b { font-size: 17px; }
.start a span { font-size: 14px; color: var(--label2); line-height: 1.45; }
.start a em { font-style: normal; font-size: 13px; color: var(--blue); font-weight: 600; margin-top: auto; }
.filters { display: flex; gap: 8px; flex-wrap: wrap; margin: 4px 0 6px; }
.filters button { padding: 6px 12px; border-radius: 999px; background: var(--fill); font-size: 14px; font-weight: 600; color: var(--label2); }
.filters button[aria-pressed="true"] { background: var(--label); color: var(--bg); }
.promise { display: flex; gap: 12px; align-items: center; background: color-mix(in srgb, var(--green) 10%, var(--bg2)); border-radius: 14px; padding: 14px 16px; margin-top: 18px; }
.promise > .ic { font-size: 28px; color: var(--green); }
.promise b { display: block; font-size: 16px; }
.promise span { font-size: 14px; color: var(--label2); }
@media (max-width: 760px) { .start { grid-template-columns: minmax(0, 1fr); } .job-grid { grid-template-columns: minmax(0, 1fr); } }

/* Kits */
.kit { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); column-gap: 30px; }
.kit li { min-width: 0; padding-bottom: 6px; }
.kit .row-txt span { white-space: normal; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
.why-kit { font-size: 14px; color: var(--label); margin: -2px 0 10px 94px; }
@media (max-width: 760px) { .kit { grid-template-columns: minmax(0, 1fr); } .why-kit { margin-left: 76px; } }

/* Videos */
#checks, #videos { scroll-margin-top: 64px; }
.vids { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 12px; }
.vid { display: flex; gap: 12px; align-items: center; background: var(--bg2); border-radius: 14px; padding: 10px; color: var(--label); min-width: 0; }
.vplay { width: 96px; aspect-ratio: 16 / 10; border-radius: 10px; display: grid; place-items: center; color: #FFFFFF; font-size: 28px; flex: none; }
.vt { min-width: 0; display: flex; flex-direction: column; gap: 3px; }
.vt b { font-size: 14.5px; font-weight: 600; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.vt span { font-size: 12.5px; color: var(--label2); display: inline-flex; gap: 4px; align-items: center; }
@media (max-width: 760px) { .vids { grid-template-columns: minmax(0, 1fr); } }

/* Search */
.search-field { position: relative; margin-bottom: 18px; display: block; }
.search-field input { padding: 10px 12px 10px 34px; font-size: 17px; background: var(--card); box-shadow: 0 0 0 1px var(--line); }
.suggest { list-style: none; padding: 0; margin: 0; }
.suggest li button { width: 100%; text-align: left; display: flex; gap: 10px; align-items: center; padding: 12px 0; border-bottom: 1px solid var(--sep); color: var(--blue); font-size: 20px; }
.suggest .ic { color: var(--label3); font-size: 18px; }
.rowlist .row-txt span, .article .row-txt span { white-space: normal; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
.rowlist { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); column-gap: 30px; }
.empty { color: var(--label2); text-align: center; padding: 50px 10px; font-size: 17px; }
.result-count { color: var(--label2); font-size: 13px; margin-bottom: 6px; }

/* Sheet & story */
dialog { border: 0; padding: 0; color: var(--label); max-width: none; max-height: none; }
dialog::backdrop { background: var(--scrim); }
dialog.sheet { background: var(--bg2); width: min(560px, 100vw); border-radius: 16px; margin: auto; box-shadow: var(--shadow); max-height: calc(100dvh - 40px); overflow-y: auto; }
dialog.sheet[open] { animation: sheetUp .32s cubic-bezier(.2,.8,.2,1); }
@keyframes sheetUp { from { transform: translateY(40px); opacity: 0; } }
.sheet-in { padding: 14px 16px 20px; display: flex; flex-direction: column; gap: 12px; }
.sheet-bar { display: flex; justify-content: space-between; align-items: center; font-weight: 600; font-size: 17px; }
.text-btn { color: var(--blue); font-size: 17px; }
.sheet-app { display: flex; gap: 12px; align-items: center; background: var(--card); border-radius: 12px; padding: 12px; }
.sheet-warn { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 10px; background: color-mix(in srgb, var(--orange) 13%, var(--card)); border-radius: 12px; padding: 12px 14px; margin-top: 10px; }
.sheet-warn .ic { color: var(--orange); font-size: 22px; margin-top: 1px; }
.sheet-warn b { font-size: 15px; display: block; }
.sheet-warn p { font-size: 13.5px; color: var(--label2); line-height: 1.45; margin-top: 2px; }
.sheet-warn a { font-size: 13.5px; font-weight: 600; }
.sheet-app .icon { width: 60px; height: 60px; }
.sheet-app .t { min-width: 0; flex: 1; }
.sheet-app b { font-size: 17px; display: block; }
.sheet-app span { font-size: 13px; color: var(--label2); display: block; overflow-wrap: anywhere; }
.sheet-help { font-size: 13.5px; color: var(--label2); padding: 0 4px; line-height: 1.45; }
.sheet-help b { color: var(--label); }
.steps { margin: 0; padding-left: 20px; font-size: 14px; display: flex; flex-direction: column; gap: 4px; }
.steps li { overflow-wrap: anywhere; }
.group-label { font-size: 13px; color: var(--label2); text-transform: uppercase; padding: 4px 4px 0; }

dialog.story-ov { width: min(720px, 100vw); height: 100dvh; border-radius: 0; background: var(--bg); overflow-y: auto; margin: 0 auto; }
@media (min-width: 761px) { dialog.story-ov { height: calc(100dvh - 48px); margin: 24px auto; border-radius: 18px; } }
dialog.story-ov[open] { animation: grow .38s cubic-bezier(.2,.8,.2,1); }
@keyframes grow { from { transform: scale(0.92); opacity: 0; } }
.story-ov .hero { position: relative; aspect-ratio: 4 / 3; max-width: 100%; color: #FFFFFF; overflow: hidden; padding: calc(24px + env(safe-area-inset-top, 0px)) 22px 22px; display: flex; flex-direction: column; }
.story-ov .hero .art { position: absolute; inset: 0; }
.story-ov .hero .copy { position: relative; display: flex; flex-direction: column; gap: 6px; }
.story-ov .hero .eyebrow { font-size: 13px; font-weight: 600; opacity: 0.8; text-transform: uppercase; }
.story-ov .hero .title { font-size: 34px; font-weight: 800; line-height: 1.05; max-width: 15ch; }
.story-ov .close { position: absolute; top: calc(14px + env(safe-area-inset-top, 0px)); right: 14px; width: 30px; height: 30px; border-radius: 50%; background: rgba(0,0,0,.35); color: #FFFFFF; display: grid; place-items: center; z-index: 2; }
.article { padding: 22px 22px 40px; display: flex; flex-direction: column; gap: 16px; font-size: 17px; line-height: 1.5; color: var(--label2); }
.article strong { color: var(--label); }
.article .rows { border-top: 1px solid var(--sep); }

.toast { position: fixed; inset: auto auto calc(90px + env(safe-area-inset-bottom, 0px)) 50%; margin: 0; border: 0; overflow: visible; transform: translate(-50%, 20px); opacity: 0; background: var(--label); color: var(--bg); padding: 10px 16px; border-radius: 12px; font-size: 14px; transition: opacity .2s, transform .2s; pointer-events: none; z-index: 60; max-width: calc(100vw - 32px); }
.toast.show { opacity: 1; transform: translate(-50%, 0); }

@media (max-width: 1180px) and (min-width: 761px) { .trust-cards { grid-template-columns: minmax(0, 1fr); } }
@media (max-width: 760px) {
  .shell { grid-template-columns: minmax(0, 1fr); }
  .side { display: none; }
  .tabbar { display: grid; grid-template-columns: repeat(4, 1fr); position: fixed; left: 0; right: 0; bottom: 0; z-index: 25; background: color-mix(in srgb, var(--bg2) 88%, transparent); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); border-top: 1px solid var(--sep); padding: 6px max(8px, env(safe-area-inset-right, 0px)) calc(4px + env(safe-area-inset-bottom, 0px)) max(8px, env(safe-area-inset-left, 0px)); }
  .tabbar button { display: flex; flex-direction: column; align-items: center; gap: 2px; font-size: 11px; font-weight: 600; color: var(--label2); }
  .tabbar .ic { font-size: 24px; }
  .tabbar button[aria-current="page"] { color: color-mix(in oklab, var(--c, var(--blue)), #FFFFFF var(--lift)); }
  .page { padding-bottom: 110px; padding-top: 14px; }
  .today { grid-template-columns: minmax(0, 1fr); gap: 22px; }
  .story { aspect-ratio: 5 / 4; }
  .story.wide { aspect-ratio: 1 / 1; }
  .story.wide .title { font-size: 28px; }
  .story.wide .glyph-art { width: 62%; right: -6%; bottom: 12%; }
  .banners { grid-auto-columns: 86%; }
  .ranked { grid-auto-columns: 88%; }
  .tiles { grid-auto-columns: 96px; }
  .tile .icon { width: 96px; height: 96px; }
  .product-head .icon { width: 104px; height: 104px; }
  .product-head .txt { min-height: 104px; }
  .product-head h1 { font-size: 22px; }
  .product-head .sub { font-size: 15px; }
  .desc, .rowlist, .trust-cards, .info { grid-template-columns: minmax(0, 1fr); }
  .inst-grid, .hn-list { grid-template-columns: minmax(0, 1fr); }
  dialog.sheet { width: 100vw; margin: auto 0 0; border-radius: 14px 14px 0 0; max-height: 92dvh; padding-bottom: env(safe-area-inset-bottom, 0px); }
}
/* ---------- The app store for open source (2026-11 redesign) ---------- */
/* Home */
.hero { padding: 8px 0 6px; }
.hero h1 { font-size: 40px; font-weight: 800; letter-spacing: -0.02em; line-height: 1.05; max-width: 18ch; }
.hero .intro { font-size: 19px; line-height: 1.45; color: var(--label2); max-width: 46ch; margin-top: 10px; }
.hero-search { max-width: 620px; margin: 22px 0 0; }
.hero-search input { font-size: 17px; padding: 13px 14px 13px 40px; border-radius: 12px; background: var(--card); box-shadow: 0 0 0 1px var(--line), 0 2px 10px -6px rgba(40, 30, 20, 0.2); }
/* A highlighter stroke behind the hero's key words */
mark.hl { color: inherit; background: linear-gradient(180deg, transparent 56%, var(--hl) 56%, var(--hl) 90%, transparent 90%); padding: 0 0.04em; -webkit-box-decoration-break: clone; box-decoration-break: clone; }
.hero-search .ic { left: 14px; font-size: 17px; }
.ideas { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; max-width: 680px; }
.ideas button { display: inline-flex; align-items: center; gap: 7px; padding: 7px 14px 7px 11px; border-radius: 999px; background: var(--card); border: 1px solid var(--line); color: var(--label); font-size: 14px; font-weight: 600; transition: background .15s ease, border-color .15s ease; }
.ideas button .ic { font-size: 16px; color: color-mix(in oklab, var(--c), #FFFFFF var(--lift)); }
.ideas button:hover { background: color-mix(in oklab, var(--c) var(--tint), var(--card)); border-color: color-mix(in oklab, var(--c) 35%, var(--line)); }

function risingShelf() {

// ---------- Tested: one task, several skills and plain Claude, judged blind (tests/<id>/results.json) ----------
const TESTS = D.TESTS || [], TEST = Object.fromEntries(TESTS.map(t => [t.id, t]));
const testImg = (t, b, c, kind) => `tests/${t.id}/img/${b}-${c}-${kind}.jpg`;
const cOf = (t, c) => t.contestants.find(x => x.id === c) || {};
const cListing = (t, c) => BY[cOf(t, c).listing];
const scoreOf = (t, b, c) => t.scores.find(s => s.brief === b && s.contestant === c);
const avgOf = (t, c) => { const s = t.scores.filter(x => x.contestant === c); return s.length ? s.reduce((a, x) => a + x.total, 0) / s.length : 0; };
const winsOf = (t, c) => Object.values(t.picks).reduce((a, p) => a + p.best.filter(x => x === c).length, 0);
const roundsOf = t => Object.values(t.picks).reduce((a, p) => a + p.best.length, 0);
const ranking = t => t.contestants.map(c => c.id).sort((a, b) => avgOf(t, b) - avgOf(t, a));
const ordinal = n => n + (['th', 'st', 'nd', 'rd'][n % 100 > 10 && n % 100 < 14 ? 0 : n % 10] || 'th');
// "Build a landing page for Streakly, a habit-tracking app for busy parents. Save…" → "A landing page for Streakly, a habit-tracking app for busy parents"
const briefTitle = (t, b) => capFirst(t.briefs[b].split('. ')[0].replace(/^Build /, ''));
const testsFor = l => TESTS.filter(t => t.contestants.some(c => c.listing === l.id));
// On a listing's page: where it placed, against plain Claude, with a link to the test
function testedBox(l) {
  return testsFor(l).map(t => {
    const c = t.contestants.find(c => c.listing === l.id).id, rank = ranking(t).indexOf(c) + 1, w = winsOf(t, c), pick = t.verdict.pick === c, skip = (t.verdict.skip || []).includes(c);
    return `<a class="tested-box${pick ? ' pick' : skip ? ' skip' : ''}" href="#test-${t.id}"><span class="lbl">Tested ${fmtDate(t.date)}</span>
      <b>${pick ? `Our pick: best of ${t.contestants.length}` : `${ordinal(rank)} of ${t.contestants.length}`} in "${esc(t.title)}"</b>
      <span>Scored ${avgOf(t, c).toFixed(1)} out of 10 in blind judging; plain Claude scored ${avgOf(t, 'none').toFixed(1)}.${w ? ` Picked best in ${w} of ${roundsOf(t)} rounds.` : ''}${skip ? ' Its page broke on phones in one of the two tasks.' : ''}</span>
      <span class="tb-link">See the pages side by side</span></a>`; }).join('');
}
// Today's lead: the newest test, with the winner's page as the picture
function testHero() {
  const t = TESTS[0]; if (!t) return '';
  const pick = t.verdict.pick, l = cListing(t, pick), b = Object.keys(t.briefs).slice(-1)[0];
  return `<div class="today"><a class="story wide test-hero" href="#test-${t.id}"><span class="shot" style="background-image:url('${testImg(t, b, pick, 'desk')}')"></span><span class="shade"></span>
    <div class="copy"><span class="eyebrow">Tested · ${fmtDate(t.date).replace(/, \d{4}$/, '')}</span><span class="title">We tested the top design skills against plain Claude</span></div>
    <div class="bottom frost">${l ? icon(l, 48) : ''}<div class="t"><b>Winner: ${esc(cOf(t, pick).name)}</b><span>Picked best in ${winsOf(t, pick)} of ${roundsOf(t)} blind rounds. Plain Claude came last on looks.</span></div><span class="get light">SEE</span></div></a></div>`;
}
const scoreBar = v => `<span class="sbar"><i style="width:${v * 10}%"></i></span><span class="snum">${v.toFixed(1)}</span>`;
function pageTest(id) {
  const t = TEST[id], order = ranking(t), briefs = Object.keys(t.briefs), pick = t.verdict.pick, simple = t.verdict.simplest;
  const card = (b, c) => { const s = scoreOf(t, b, c), run = t.runs.find(r => r.brief === b && r.contestant === c) || {}, l = cListing(t, c);
    return `<figure class="test-card${c === pick ? ' win' : ''}"><a class="shots" href="${testImg(t, b, c, 'desk')}" target="_blank" rel="noopener"><img src="${testImg(t, b, c, 'desk')}" alt="${esc(cOf(t, c).name)}, desktop" loading="lazy"><img class="ph" src="${testImg(t, b, c, 'phone')}" alt="${esc(cOf(t, c).name)}, phone" loading="lazy"></a>
      <figcaption><span class="tc-h"><b>${l ? `<a href="#${l.id}">${esc(cOf(t, c).name)}</a>` : esc(cOf(t, c).name)}</b><span class="sc">${s.total.toFixed(1)}</span></span>
        <p>“${esc(s.why[0])}”</p><small>${run.seconds} seconds · $${(run.costUSD || 0).toFixed(2)}${run.phoneOverflowPx > 0 ? ' · <span class="c-orange">scrolls sideways on phones</span>' : ''}</small></figcaption></figure>`; };
  return `<div class="navbar"><div class="in"><a class="back" href="#tested">${ic('back', 2.4)}Tested</a></div></div>
  <div class="page" style="padding-top:12px">
    <div class="large-title"><div class="date-eyebrow">Tested ${fmtLong(t.date)}</div><h1>${esc(t.title)}</h1><p>${esc(t.question)}</p></div>
    <section class="verdict-box"><h2>The verdict</h2><p>${esc(t.verdict.note)}</p>
      <div class="rowlist">${[[pick, 'Install this'], [simple, 'Simplest, built into the Claude app']].filter(([c]) => cListing(t, c)).map(([c, why]) => `<div class="vb-pick"><span class="lbl">${why}</span>${row(cListing(t, c))}</div>`).join('')}</div>
      <p class="note">They all do the same job, so install one. Two design skills compete with each other and both take up room in every session.</p></section>
    <section class="shelf"><div class="shelf-head"><h2>Scores<span class="sub">Blind judging, out of 10: looks designed, clarity, fit, polish and phone, averaged over ${t.judge.rounds} rounds</span></h2></div>
      <div class="cmp-wrap"><table class="cmp score-table"><thead><tr><th>Skill</th>${briefs.map(b => `<th>${esc(briefTitle(t, b).split(',')[0].replace(/^A (landing page|homepage) for /, ''))}</th>`).join('')}<th>Picked best</th><th>Our safety check</th></tr></thead>
      <tbody>${order.map(c => { const l = cListing(t, c);
        return `<tr class="${c === pick ? 'win' : ''}"><td>${l ? `<a href="#${l.id}">${esc(cOf(t, c).name)}</a><small>${esc(repoOf(l).on)}</small>` : `<b>${esc(cOf(t, c).name)}</b><small>No skill installed</small>`}</td>
          ${briefs.map(b => `<td class="sc-cell">${scoreBar(scoreOf(t, b, c).total)}</td>`).join('')}<td>${winsOf(t, c)} of ${roundsOf(t)}</td><td>${l ? `<span class="${trust(l).cls}">${trust(l).short}</span>` : '—'}</td></tr>`; }).join('')}</tbody></table></div></section>
    ${briefs.map(b => `<section class="shelf"><div class="shelf-head"><h2>${esc(briefTitle(t, b))}<span class="sub">Everyone got the same request: “${esc(t.briefs[b])}”</span></h2></div>
      <div class="test-grid">${order.map(c => card(b, c)).join('')}</div></section>`).join('')}
    <details class="full"><summary><b>How we tested</b><span>Same request, clean sessions, blind judges</span></summary>
      <ul class="method"><li><b>Same request for everyone.</b> Each page was made in its own fresh Claude Code session (${esc(t.model.replace('claude-', 'Claude ').replace(/-(\d)-(\d)$/, ' $1.$2').replace('sonnet', 'Sonnet'))}) with no other skills installed. The skill was copied into the project, as <code>npx skills add</code> does. Every skill switched on by itself; nobody named it.</li>
        <li><b>Versions.</b> ${t.contestants.filter(c => c.repo).map(c => `${esc(c.name)}: <a class="mono" href="https://github.com/${c.repo}/tree/${c.commit}/${c.path}" target="_blank" rel="noopener">${esc(c.repo)} ${esc(c.commit)}</a>`).join(', ')}.</li>
        <li><b>Blind judging.</b> ${esc(t.judge.how)}. The judge was ${esc(t.judge.model.replace('claude-', 'Claude ').replace(/-(\d)-(\d)$/, ' $1.$2').replace('opus', 'Opus'))}.</li>
        <li><b>Cost.</b> $${t.cost.generationUSD.toFixed(2)} to make the pages and $${t.cost.judgingUSD.toFixed(2)} to judge them.</li></ul>
      <h3 style="font-size:17px;margin:16px 0 6px">Caveats</h3><ul class="method">${t.caveats.map(x => `<li>${esc(x)}</li>`).join('')}</ul></details>
    ${dataNote()}</div>`;
}
function pageTested() {
  return `<div class="page"><div class="large-title"><h1>Tested</h1><p>Most AI skills don't help, and every one you install takes up room in each session. So we give the popular ones the same job as plain Claude, judge the results blind, and tell you which one to keep.</p></div>
    <div class="tests">${TESTS.map(t => { const pick = t.verdict.pick, b = Object.keys(t.briefs).slice(-1)[0];
      return `<a class="test-tile" href="#test-${t.id}"><span class="shot" style="background-image:url('${testImg(t, b, pick, 'desk')}')"></span><span class="tt-body"><span class="lbl">${fmtDate(t.date)} · ${t.contestants.length} contestants</span><b>${esc(t.title)}</b><span>Winner: ${esc(cOf(t, pick).name)}, picked best in ${winsOf(t, pick)} of ${roundsOf(t)} blind rounds.</span></span></a>`; }).join('')}</div>

// ---------- What we caught ----------
// Every note a review wrote on a listing: risks first, then by stars. Things the code does that a README doesn't lead with.
const LV_RANK = { bad: 0, warn: 1, note: 2 };
const caughtAll = () => vis(L).flatMap(l => NT(l).map(n => ({ l, n }))).sort((a, b) => LV_RANK[a.n.lv] - LV_RANK[b.n.lv] || repoOf(b.l).st - repoOf(a.l).st);
const lowFirst = t => t.charAt(0).toLowerCase() + t.slice(1);
const caughtRow = ({ l, n }) => `<a class="caught-row" href="#${l.id}">${icon(l, 48)}<span class="ct"><b>${esc(l.n)}: ${esc(lowFirst(n.t))}</b><span>${esc(plainOf(l))}</span></span><span class="chip ${NT_LV[n.lv][1]}">${NT_LV[n.lv][2]}</span></a>`;
function caughtHero() {
  const top = caughtAll()[0];
  if (!top) return '';
  const { l, n } = top;
  return `<div class="today"><a class="story wide caught-hero" href="#${l.id}">${art(['#7C2D12', '#EA580C'], 'shieldq')}
    <div class="copy"><span class="eyebrow">What we caught</span><span class="title">${esc(l.n)}: ${esc(lowFirst(n.t))}</span></div>

  if (d.more) { S.more = Number(d.more); refocus(); return; }
  if ('focus' in d) { drawPanel(); if (!panel.open) { panel.showModal(); pushModal(panel); } return; }
  if (d.fset) { setFocus(d.fset, d.fval); return; }
  if (d.save) { const on = !inList(d.save); LIST = on ? [...LIST, d.save] : LIST.filter(x => x !== d.save); saveList(); if (sheet.open) drawSheet(); refocus(); toast(on ? 'Saved to your list' : 'Removed from your list'); return; }
  if ('audit' in d) { S.audit = !!t.checked; const y = scrollY; render(); scrollTo(0, y); return; }
  if (d.share) { const l = BY[d.share]; share(`${l.n} on Skillshelf`, `${l.n}: ${plainOf(l)}${l.alt?.paid ? ` A free alternative to ${l.alt.n}.` : ''} Found on Skillshelf, the app store for open source.`, l.id); return; }
  if ('sharelist' in d) { share('My Skillshelf list', `${LIST.length} open-source picks from Skillshelf, the app store for open source.`, 'list=' + LIST.join(',')); return; }
  if (d.sharekit) { share(KIT[d.sharekit][1], KIT[d.sharekit][2], 'kit-' + d.sharekit); return; }
  if (d.savekit || 'savelist' in d) { const ids = d.savekit ? KIT[d.savekit][5].map(x => x[0]).filter(id => BY[id]) : S.shared, add = ids.filter(id => !inList(id));
    LIST = [...LIST, ...add]; saveList(); refocus(); toast(add.length ? `${add.length} saved to your list` : 'Already in your list'); return; }
  if ('mdlist' in d) { copyText(listMarkdown((S.shared || LIST).map(id => BY[id]).filter(Boolean)), 'Copied as Markdown'); return; }
  if ('clearlist' in d) { if (confirm(`Remove all ${LIST.length} from your list?`)) { LIST = []; saveList(); refocus(); } return; }
  // A kind keeps the topic you're on; with no topic it's Browse's own link (#tools), so it can be shared
  if (d.kind) { S.kind = KIND_HASH[d.kind]; S.more = 0; if (!S.job) history.replaceState(history.state, '', '#' + (d.kind === 'all' ? 'browse' : d.kind)); refocus(); return; }
  if ('easyoff' in d) { S.easy = false; refocus(); return; }
  if ('copysetup' in d) { copyText(`${SITE}#${setupHash()}`, 'Link to this setup copied'); return; }
  if ('focusreset' in d) { FOCUS = { ...FOCUS0 }; SHOW_ALL = false; saveFocus(); refocus(); return; }
  if ('closepanel' in d) { closeModal(panel); return; }
  if (d.showall) { SHOW_ALL = d.showall === '1'; refocus(); return; }
  if (d.tab) { e.preventDefault(); go(d.tab); }
  else if (d.get) { e.preventDefault(); e.stopPropagation(); openSheet(d.get); }
  else if (d.story) openStory(d.story);
  else if ('closestory' in d) closeModal(story);
  else if ('closesheet' in d) { if (target) e.preventDefault(); closeModal(sheet, target); }
  else if (d.copy) {
    const text = d.copy;
    const fallback = () => { const code = (t.closest('.copybox') || t.closest('.inst-card') || t.parentElement).querySelector('code'); const r = document.createRange(); r.selectNodeContents(code); const s = getSelection(); s.removeAllRanges(); s.addRange(r); toast('Selected. Press Ctrl+C or ⌘C to copy'); };
    try { navigator.clipboard.writeText(text).then(() => toast(d.copymsg || 'Copied'), fallback); } catch (err) { fallback(); }
  }
  else if (d.agent) {
    S.agent = d.agent; try { localStorage.setItem('vetted-agent', S.agent); } catch (err) {}
    if (sheet.open) drawSheet();
    if (S.detail) { const y = scrollY; render(); scrollTo(0, y); }
  }
  else if (d.suggest) { setQuery(d.suggest); if (S.tab !== 'browse' || S.detail) go('search'); else { render(); const q = document.getElementById('q'); if (q) q.focus(); } }
  else if ('unclamp' in d) { t.previousElementSibling.classList.remove('clamp'); t.remove(); }
  else if (d.jump) { e.preventDefault(); const el = document.getElementById(d.jump); if (el?.tagName === 'DETAILS') el.open = true; el?.scrollIntoView({ behavior: 'smooth', block: 'start' }); }
  else if (d.easy) { S.easy = d.easy === '1'; const y = scrollY; render(); scrollTo(0, y); }
  else if (d.seeall) { S.q = d.seeall; document.getElementById("side-q").value = S.q; go("search"); }
});
// One search across the sidebar, the home page and Browse: typing anywhere shows results in Browse
function setQuery(v) { S.q = v; for (const id of ['side-q', 'q', 'home-q']) { const el = document.getElementById(id); if (el && el.value !== v) el.value = v; } }
function drawResults() {
  const r = document.getElementById('results'), all = document.getElementById('browse-all'), on = !!S.q.trim();
  if (r) { r.hidden = !on; r.innerHTML = on ? resultsHTML() : ''; } if (all) all.hidden = on;
}
document.addEventListener('input', e => {
  if (e.target.id === 'iq') { S.iq = e.target.value; const r = document.getElementById('instead-results'); if (r) r.innerHTML = insteadHTML(); return; }
  if (!['q', 'side-q', 'home-q'].includes(e.target.id)) return;
  setQuery(e.target.value);
  if (S.tab !== 'browse' || S.detail) go('search'); else drawResults();
});
document.addEventListener('change', e => { if (e.target.matches('[data-sort]')) { S.sort = e.target.value; S.more = 0; refocus(); }
  if (e.target.matches('[data-easybox]')) { S.easy = e.target.checked; S.more = 0; refocus(); } });
sheet.addEventListener('click', e => { if (e.target === sheet) sheet.close(); });
story.addEventListener('click', e => { if (e.target === story) story.close(); });
sheet.addEventListener('close', () => onModalClose(sheet));
story.addEventListener('close', () => onModalClose(story));
panel.addEventListener('close', () => onModalClose(panel));
panel.addEventListener('click', e => { if (e.target === panel) panel.close(); });
// Each page visit gets an id in its history entry. Going back to a page restores where you were on it; a new visit starts at the top.
const POS = {};
const stamp = () => { if (!history.state?.nav) history.replaceState({ ...(history.state || {}), nav: Date.now().toString(36) + Math.random().toString(36).slice(2, 6) }, ''); return history.state.nav; };
let curNav = stamp(), prevHash = null;
// The phone's floating button gets out of the way while you scroll down, and comes back when you scroll up

// Today has its own Make it yours link at the top, so the floating one waits until that's scrolled away

window.addEventListener('hashchange', e => {
  track(location.hash.slice(1) || 'home');
  POS[curNav] = window.scrollY;
  prevHash = decodeURIComponent(new URL(e.oldURL).hash.slice(1));
  const seen = history.state?.nav;
  route();
  window.scrollTo(0, seen && POS[seen] != null ? POS[seen] : 0);
  curNav = stamp();
});
// A Back link to the page you just came from goes back in history, so the browser's Back button doesn't bounce you forward again
document.addEventListener('click', e => {
  const a = e.target.closest('a.back');
  if (a && prevHash != null && a.getAttribute('href') === '#' + prevHash) { e.preventDefault(); history.back(); }
});

document.getElementById('mark').innerHTML = MARK;
document.getElementById('side-q-ic').innerHTML = ic('search');
document.getElementById('side-foot').innerHTML = `${shownN()} open-source projects from GitHub. Data from ${dataDates()}.<br><a href="https://github.com/${MARKET_REPO}" target="_blank" rel="noopener">Skillshelf on GitHub ${ic('ext')}</a>`;
route();
