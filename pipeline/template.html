<title>Vetted Skill Store</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Layout: app-store pattern. Sidebar on desktop, bottom tab bar on phones; Today stories, shelves, product pages, install sheet. All listings are real repos. */
:root {
  --bg: #FFFFFF; --bg2: #F2F2F7; --card: #FFFFFF; --label: #000000; --label2: #6E6E73; --label3: #AEAEB2;
  --sep: rgba(60, 60, 67, 0.18); --fill: #EEEEF3; --blue: #007AFF; --red: #FF3B30; --green: #248A3D; --orange: #C26A00;
  --sidebar: #F5F5F7; --scrim: rgba(0, 0, 0, 0.4); --shadow: 0 10px 40px rgba(0, 0, 0, 0.12); --code: #F6F6F9;
  --font: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Display", "Segoe UI Variable Text", "Segoe UI", system-ui, "Helvetica Neue", Arial, sans-serif;
  --mono: ui-monospace, "SF Mono", "Cascadia Mono", Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #000000; --bg2: #1C1C1E; --card: #1C1C1E; --label: #FFFFFF; --label2: #98989F; --label3: #636366;
  --sep: rgba(84, 84, 88, 0.6); --fill: #2C2C2E; --blue: #0A84FF; --red: #FF453A; --green: #30D158; --orange: #FF9F0A;
  --sidebar: #141416; --scrim: rgba(0, 0, 0, 0.6); --shadow: 0 10px 40px rgba(0, 0, 0, 0.6); --code: #0F0F11; color-scheme: dark;
} }
:root[data-theme="dark"] {
  --bg: #000000; --bg2: #1C1C1E; --card: #1C1C1E; --label: #FFFFFF; --label2: #98989F; --label3: #636366;
  --sep: rgba(84, 84, 88, 0.6); --fill: #2C2C2E; --blue: #0A84FF; --red: #FF453A; --green: #30D158; --orange: #FF9F0A;
  --sidebar: #141416; --scrim: rgba(0, 0, 0, 0.6); --shadow: 0 10px 40px rgba(0, 0, 0, 0.6); --code: #0F0F11; color-scheme: dark;
}

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--label); font-family: var(--font); font-size: 15px; line-height: 1.4; -webkit-font-smoothing: antialiased; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--bg); }
h1, h2, h3, h4 { margin: 0; text-wrap: balance; }
p { margin: 0; }
a { color: var(--blue); text-decoration: none; }
button { font: inherit; color: inherit; cursor: pointer; border: 0; background: none; padding: 0; }
:focus-visible { outline: 2px solid var(--blue); outline-offset: 2px; border-radius: 6px; }
.mono { font-family: var(--mono); font-size: 0.9em; }
.ic { width: 1em; height: 1em; flex: none; }
.c-green { color: var(--green); } .c-orange { color: var(--orange); } .c-red { color: var(--red); } .c-blue { color: var(--blue); } .c-gray { color: var(--label2); }

/* Shell */
.shell { display: grid; grid-template-columns: 240px minmax(0, 1fr); min-height: 100%; }
.side { background: var(--sidebar); border-right: 1px solid var(--sep); padding: 18px 12px; position: sticky; top: 0; height: 100vh; display: flex; flex-direction: column; gap: 4px; }
.wordmark { display: flex; align-items: center; gap: 8px; font-weight: 700; font-size: 17px; padding: 4px 10px 12px; }
.mark { width: 26px; height: 26px; border-radius: 7px; background: linear-gradient(160deg, #3B82F6, #1D4ED8); color: #FFFFFF; display: grid; place-items: center; font-size: 15px; }
.side-search { position: relative; margin: 0 4px 10px; display: block; }
.side-search input, .search-field input { width: 100%; border: 0; background: var(--fill); color: var(--label); border-radius: 10px; padding: 8px 10px 8px 32px; font: inherit; }
.side-search .ic, .search-field .ic { position: absolute; left: 10px; top: 50%; transform: translateY(-50%); color: var(--label2); font-size: 15px; }
.nav-item { display: flex; align-items: center; gap: 10px; padding: 7px 10px; border-radius: 8px; color: var(--label); font-size: 15px; font-weight: 500; width: 100%; text-align: left; }
.nav-item .ic { color: var(--blue); font-size: 18px; }
.nav-item[aria-current="page"] { background: var(--fill); }
.nav-item .n { margin-left: auto; color: var(--label2); font-size: 13px; font-variant-numeric: tabular-nums; }
.side-foot { margin-top: auto; padding: 10px; font-size: 12px; color: var(--label2); line-height: 1.45; }
.tabbar { display: none; }
.main { min-width: 0; }
.page { max-width: 1120px; margin: 0 auto; padding-block: 28px 60px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
@media (min-width: 761px) { .page { padding-left: 36px; padding-right: 36px; } }
.date-eyebrow { font-size: 13px; font-weight: 600; color: var(--label2); text-transform: uppercase; letter-spacing: 0.02em; }
.large-title { margin-bottom: 18px; }
.large-title h1 { font-size: 34px; font-weight: 700; letter-spacing: 0.01em; }
.large-title p { color: var(--label2); font-size: 15px; margin-top: 4px; max-width: 70ch; }
.large-title .intro { font-size: 17px; line-height: 1.45; color: var(--label); max-width: 62ch; margin-top: 6px; }
.intro-links { display: flex; gap: 16px; flex-wrap: wrap; margin-top: 8px; }
.intro-links a, .intro-links button { color: var(--blue); font-size: 15px; font-weight: 600; }
.data-note { margin-top: 40px; font-size: 12px; color: var(--label2); border-top: 1px solid var(--sep); padding-top: 14px; max-width: 80ch; line-height: 1.5; }

/* Today */
.today { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 26px; }
.story { position: relative; border-radius: 18px; overflow: hidden; aspect-ratio: 4 / 3; max-width: 100%; box-shadow: var(--shadow); color: #FFFFFF; text-align: left; display: flex; flex-direction: column; transition: transform .25s cubic-bezier(.2,.8,.2,1); width: 100%; }
.story:hover { transform: scale(0.99); }
.story:active { transform: scale(0.97); }
.story .art { position: absolute; inset: 0; }
.story .copy { position: relative; padding: 20px 20px 0; display: flex; flex-direction: column; gap: 4px; }
.story .eyebrow { font-size: 13px; font-weight: 600; text-transform: uppercase; opacity: 0.8; letter-spacing: 0.02em; }
.story .title { font-size: 28px; font-weight: 800; line-height: 1.08; letter-spacing: -0.01em; max-width: 16ch; }
.story .bottom { position: relative; margin-top: auto; padding: 0 20px 20px; font-size: 15px; opacity: .9; }
.story .bottom.frost { opacity: 1; padding: 12px 16px; background: rgba(255,255,255,.16); backdrop-filter: blur(20px) saturate(1.4); -webkit-backdrop-filter: blur(20px) saturate(1.4); display: flex; align-items: center; gap: 12px; }
.story .bottom.frost .t { flex: 1; min-width: 0; }
.story .bottom.frost b { display: block; font-size: 15px; }
.story .bottom.frost .t span { font-size: 13px; opacity: .85; display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.story.wide { grid-column: 1 / -1; aspect-ratio: 2.6 / 1; }
.story.wide .title { font-size: 40px; max-width: 14ch; }
.glyph-art { position: absolute; right: -6%; bottom: 12%; width: 62%; aspect-ratio: 1; opacity: 0.2; color: #FFFFFF; }
.story.wide .glyph-art { width: 34%; right: 4%; bottom: -4%; }
.orb { position: absolute; border-radius: 50%; }
.stat-big { font-size: 64px; font-weight: 800; line-height: 1; letter-spacing: -0.02em; }

/* Shelves */
.shelf { margin-top: 34px; }
.shelf-head { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; border-top: 1px solid var(--sep); padding-top: 14px; margin-bottom: 12px; }
.shelf-head h2 { font-size: 22px; font-weight: 700; }
.shelf-head .sub { color: var(--label2); font-size: 15px; display: block; font-weight: 400; margin-top: 2px; }
.see-all { font-size: 17px; white-space: nowrap; color: var(--blue); }
.scroller { display: grid; grid-auto-flow: column; gap: 18px; overflow-x: auto; scroll-snap-type: x mandatory; scrollbar-width: none; padding-bottom: 4px; }
.scroller::-webkit-scrollbar { display: none; }
.scroller > * { scroll-snap-align: start; }
.banners { grid-auto-columns: minmax(0, calc((100% - 18px) / 2)); }
.banner { display: flex; flex-direction: column; gap: 3px; text-align: left; min-width: 0; color: var(--label); }
.banner .eb { font-size: 12px; font-weight: 600; color: var(--blue); text-transform: uppercase; letter-spacing: 0.02em; }
.banner .bt { font-size: 21px; font-weight: 600; }
.banner .bs { font-size: 16px; color: var(--label2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.banner .bart { margin-top: 8px; border-radius: 12px; aspect-ratio: 16 / 9; max-width: 100%; position: relative; overflow: hidden; display: flex; align-items: flex-end; padding: 16px; color: #FFFFFF; }
.banner .bart .bline { position: relative; display: flex; align-items: center; gap: 10px; font-size: 14px; font-weight: 600; }
.ranked { grid-template-rows: repeat(3, auto); grid-auto-columns: minmax(300px, calc((100% - 36px) / 3)); column-gap: 18px; row-gap: 0; }
.ranked.two { grid-template-rows: repeat(2, auto); }
.ranked.one { grid-template-rows: auto; }
.tiles { grid-auto-columns: 118px; }
.tile { display: flex; flex-direction: column; gap: 6px; text-align: left; color: var(--label); min-width: 0; }
.tile .icon { width: 118px; height: 118px; }
.tile b { font-size: 14px; font-weight: 500; display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tile span { font-size: 12px; color: var(--label2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

/* Icons */
.icon { flex: none; border-radius: 22.5%; display: grid; place-items: center; color: #FFFFFF; position: relative; overflow: hidden; box-shadow: inset 0 0 0 0.5px rgba(0,0,0,.14); background: var(--fill); }
.icon::after { content: ""; position: absolute; inset: 0; background: linear-gradient(180deg, rgba(255,255,255,.2), rgba(255,255,255,0) 55%); pointer-events: none; }
.icon > svg { width: 50%; height: 50%; }
.icon > img { width: 100%; height: 100%; object-fit: cover; display: block; }
.icon .av { position: absolute; right: 6%; bottom: 6%; width: 34%; height: 34%; border-radius: 28%; background: #FFFFFF; box-shadow: 0 1px 4px rgba(0,0,0,.3); overflow: hidden; z-index: 1; }
.icon .av img { width: 100%; height: 100%; display: block; }

/* Rows */
.row { display: flex; align-items: center; gap: 12px; padding: 10px 0; min-width: 0; }
.row .rank { width: 18px; font-size: 17px; font-weight: 600; text-align: center; flex: none; }
.row-body { flex: 1; min-width: 0; display: flex; align-items: center; gap: 12px; align-self: stretch; border-bottom: 1px solid var(--sep); padding-block: 6px; }
.ranked .row:nth-child(3n) .row-body, .ranked.two .row:nth-child(2n) .row-body, .ranked.one .row-body { border-bottom: 0; }
.ranked.two .row:nth-child(3n) .row-body { border-bottom: 1px solid var(--sep); }
.ranked.two .row:nth-child(6n) .row-body { border-bottom: 0; }
.row-txt { flex: 1; min-width: 0; text-align: left; }
.row-txt b { display: block; font-size: 16px; font-weight: 500; color: var(--label); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.row-txt span { display: block; font-size: 13px; color: var(--label2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.btn-col { display: flex; flex-direction: column; align-items: center; gap: 3px; flex: none; }
.iap { font-size: 10px; color: var(--label2); white-space: nowrap; display: inline-flex; align-items: center; gap: 2px; }
.get { min-width: 76px; height: 30px; border-radius: 15px; background: var(--fill); color: var(--blue); font-size: 15px; font-weight: 700; letter-spacing: 0.02em; padding: 0 16px; display: inline-grid; place-items: center; }
.get.primary { background: var(--blue); color: #FFFFFF; }
.get.light { background: #FFFFFF; color: #007AFF; }
.pill-link { display: inline-flex; align-items: center; gap: 6px; height: 30px; padding: 0 14px; border-radius: 15px; background: var(--fill); color: var(--blue); font-weight: 600; font-size: 14px; }

/* Product page */
.navbar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: color-mix(in srgb, var(--bg) 82%, transparent); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); }
.navbar .in { max-width: 1120px; margin: 0 auto; display: flex; align-items: center; gap: 10px; padding-block: 10px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
@media (min-width: 761px) { .navbar .in { padding-left: 36px; padding-right: 36px; } }
.back { display: inline-flex; align-items: center; gap: 2px; color: var(--blue); font-size: 17px; }
.back .ic { font-size: 22px; }
.product-head { display: flex; gap: 20px; align-items: flex-start; }
.product-head .icon { width: 128px; height: 128px; }
.product-head .txt { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; min-height: 128px; }
.product-head h1 { font-size: 26px; font-weight: 700; overflow-wrap: anywhere; }
.product-head .sub { font-size: 17px; color: var(--label2); }
.product-head .acts { margin-top: auto; display: flex; align-items: center; gap: 10px; padding-top: 12px; flex-wrap: wrap; }
.strip { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(118px, 1fr); overflow-x: auto; scrollbar-width: none; margin-top: 22px; border-block: 1px solid var(--sep); padding-block: 12px; }
.strip::-webkit-scrollbar { display: none; }
.strip > div { text-align: center; padding: 0 10px; border-left: 1px solid var(--sep); display: flex; flex-direction: column; align-items: center; gap: 2px; min-width: 0; }
.strip > div:first-child { border-left: 0; }
.strip .k { font-size: 11px; font-weight: 600; color: var(--label3); text-transform: uppercase; letter-spacing: 0.02em; white-space: nowrap; }
.strip .v { font-size: 20px; font-weight: 700; color: var(--label2); display: flex; align-items: center; gap: 4px; white-space: nowrap; font-variant-numeric: tabular-nums; }
.strip .v.c-green { color: var(--green); } .strip .v.c-blue { color: var(--blue); }
.strip .c { font-size: 12px; color: var(--label2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100%; }
.desc { margin-top: 26px; display: grid; grid-template-columns: minmax(0, 1fr) 260px; gap: 30px; }
.desc p { font-size: 15px; line-height: 1.55; max-width: 68ch; overflow-wrap: anywhere; }
.desc > div { min-width: 0; }
.desc p.clamp { display: -webkit-box; -webkit-line-clamp: 5; -webkit-box-orient: vertical; overflow: hidden; }
.desc .more { color: var(--blue); font-size: 15px; font-weight: 600; margin-top: 4px; }
.desc .lbl { display: block; font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .03em; color: var(--label2); margin-bottom: 4px; }
.desc .dev a { font-size: 15px; display: block; overflow-wrap: anywhere; }
.desc .dev span { font-size: 13px; color: var(--label2); display: block; }
.desc .dev > div + div { margin-top: 12px; }

/* Install blocks */
.inst-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 14px; }
.inst-card { background: var(--bg2); border-radius: 14px; padding: 14px 16px; display: flex; flex-direction: column; gap: 10px; min-width: 0; }
.sheet .inst-card { background: var(--card); }
.inst-card .h { display: flex; align-items: center; gap: 8px; }
.inst-card .h b { font-size: 16px; }
.inst-card .how { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .03em; color: var(--label2); background: var(--fill); padding: 2px 7px; border-radius: 5px; }
.inst-card .note { font-size: 13px; color: var(--label2); }
.inst-card.scan { background: color-mix(in srgb, var(--green) 10%, var(--bg2)); }
.sheet .inst-card.scan { background: color-mix(in srgb, var(--green) 10%, var(--card)); }
.copybox { display: flex; gap: 8px; align-items: center; background: var(--code); border: 1px solid var(--sep); border-radius: 10px; padding: 8px 8px 8px 12px; min-width: 0; }
.copybox code { flex: 1; min-width: 0; font-family: var(--mono); font-size: 12.5px; white-space: pre-wrap; overflow-wrap: anywhere; line-height: 1.45; }
.dev-scan { margin-top: 4px; }
.inst-card.ask { background: color-mix(in srgb, var(--blue) 8%, var(--bg2)); }
.sheet .inst-card.ask { background: color-mix(in srgb, var(--blue) 8%, var(--card)); }
.ask-btns { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.ask-btns .get { width: auto; padding: 0 16px; }
.ask-q { flex-basis: 100%; }
.ask-q > summary { cursor: pointer; color: var(--label2); font-size: 13px; padding: 2px 0; }
.ask-q[open] > summary { margin-bottom: 6px; }
/* Focus: a viewer's own setup */
.side-tailor { display: flex; align-items: center; gap: 10px; margin: 0 4px 10px; padding: 9px 12px; border-radius: 10px; background: color-mix(in srgb, var(--blue) 12%, var(--bg2)); color: var(--blue); font-weight: 600; font-size: 15px; text-align: left; }
.side-tailor .ic { font-size: 18px; }
.side-tailor small { display: block; font-weight: 400; font-size: 12px; color: var(--label2); }
.fab { display: none; }
.focusbar { max-width: 1120px; margin: 0 auto; padding: 12px max(16px, env(safe-area-inset-right, 0px)) 0 max(16px, env(safe-area-inset-left, 0px)); }
@media (min-width: 761px) { .focusbar { padding: 18px 36px 0; } }
.focusbar .in { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 14px; background: color-mix(in srgb, var(--blue) 9%, var(--bg2)); border-radius: 12px; padding: 10px 14px; font-size: 14px; }
.focusbar .fb-t { flex: 1 1 220px; min-width: 0; }
.focusbar .fb-t span { color: var(--label2); }
.focusbar button { color: var(--blue); font-weight: 600; font-size: 14px; }
dialog.panel { background: var(--bg); width: min(420px, 100vw); height: 100dvh; max-height: 100dvh; margin: 0 0 0 auto; border-radius: 0; box-shadow: var(--shadow); overflow-y: auto; }
dialog.panel[open] { animation: panelIn .28s cubic-bezier(.2,.8,.2,1); }
@keyframes panelIn { from { transform: translateX(40px); opacity: 0; } }
.panel-in { padding: 16px 18px 0; display: flex; flex-direction: column; gap: 18px; }
.panel-bar { display: flex; justify-content: space-between; align-items: center; }
.panel-bar b { font-size: 21px; }
.panel-sub { font-size: 14px; color: var(--label2); margin-top: -10px; }
.pgroup h3 { font-size: 15px; margin-bottom: 8px; }
.pchips { display: flex; flex-wrap: wrap; gap: 8px; }
.pchip { padding: 7px 12px; border-radius: 12px; background: var(--fill); font-size: 14px; font-weight: 600; color: var(--label); border: 1.5px solid transparent; text-align: left; }
.pchip small { display: block; font-weight: 400; color: var(--label2); font-size: 12px; }
.pchip[aria-pressed="true"] { background: color-mix(in srgb, var(--blue) 13%, var(--bg)); border-color: var(--blue); color: var(--blue); }
.panel-foot { position: sticky; bottom: 0; background: var(--bg); padding: 12px 0 calc(16px + env(safe-area-inset-bottom, 0px)); display: flex; align-items: center; gap: 12px; border-top: 1px solid var(--sep); }
.panel-foot .cnt { flex: 1; font-size: 14px; color: var(--label2); }
.panel-foot .text-btn { font-size: 15px; }
.shelf:has(> .scroller.ranked:empty), .shelf:has(> .picks:empty), .shelf:has(> .rowlist:empty), .shelf:has(> .scroller.tiles:empty) { display: none; }
@media (max-width: 760px) {
  .fab { display: inline-flex; position: fixed; right: 16px; bottom: calc(74px + env(safe-area-inset-bottom, 0px)); z-index: 24; align-items: center; gap: 6px; height: 40px; padding: 0 14px; border-radius: 999px; background: var(--blue); color: #FFFFFF; font-weight: 700; font-size: 14px; box-shadow: var(--shadow); transition: transform .25s ease, opacity .25s ease; }
  .fab .ic { width: 18px; height: 18px; }
  .fab.hide { transform: translateY(160%); opacity: 0; pointer-events: none; }
  body[data-detail="1"] .fab { display: none; }
  dialog.panel { width: 100vw; height: auto; max-height: 92dvh; margin: auto 0 0; border-radius: 14px 14px 0 0; }
  dialog.panel[open] { animation: sheetUp .32s cubic-bezier(.2,.8,.2,1); }
}
/* Tested */
.test-hero { background: #16120F; }
.test-hero .shot { position: absolute; top: 0; bottom: 0; right: 0; left: 40%; background-size: cover; background-position: left top; }
.test-hero .shade { position: absolute; inset: 0; background: linear-gradient(90deg, #16120F 0%, #16120F 40%, rgba(22,18,15,.55) 52%, rgba(22,18,15,0) 70%); }
.test-hero .title { max-width: 18ch; text-shadow: 0 1px 12px rgba(0,0,0,.35); }
a.tested-box { display: flex; flex-direction: column; align-items: flex-start; gap: 4px; margin-top: 12px; padding: 14px 16px; border-radius: 14px; border: 1px solid var(--sep); background: var(--card); color: var(--label); }
.tested-box.pick { border-color: var(--green); background: color-mix(in srgb, var(--green) 7%, var(--card)); }
.tested-box.skip { border-color: var(--orange); }
.tested-box span { font-size: 14px; color: var(--label2); } .tested-box b { font-size: 16px; }
.tested-box .tb-link { color: var(--blue); font-weight: 600; }
.verdict-box { margin: 6px 0 8px; padding: 18px; border-radius: 16px; background: color-mix(in srgb, var(--green) 7%, var(--bg2)); }
.verdict-box h2 { font-size: 20px; margin: 0 0 6px; } .verdict-box > p { margin: 0 0 8px; line-height: 1.5; }
.verdict-box .note { font-size: 13px; color: var(--label2); }
.vb-pick .lbl { display: block; margin-top: 8px; }
.score-table .sc-cell { white-space: nowrap; } .score-table tr.win td { background: color-mix(in srgb, var(--green) 8%, transparent); }

// ---------- Tested: one task, several skills and plain Claude, judged blind (tests/<id>/results.json) ----------
const TESTS = D.TESTS || [], TEST = Object.fromEntries(TESTS.map(t => [t.id, t]));
const testImg = (t, b, c, kind) => `tests/${t.id}/img/${b}-${c}-${kind}.jpg`;
const cOf = (t, c) => t.contestants.find(x => x.id === c) || {};
const cListing = (t, c) => BY[cOf(t, c).listing];
const scoreOf = (t, b, c) => t.scores.find(s => s.brief === b && s.contestant === c);
const avgOf = (t, c) => { const s = t.scores.filter(x => x.contestant === c); return s.length ? s.reduce((a, x) => a + x.total, 0) / s.length : 0; };
const winsOf = (t, c) => Object.values(t.picks).reduce((a, p) => a + p.best.filter(x => x === c).length, 0);
const roundsOf = t => Object.values(t.picks).reduce((a, p) => a + p.best.length, 0);
const ranking = t => t.contestants.map(c => c.id).sort((a, b) => avgOf(t, b) - avgOf(t, a));
const ordinal = n => n + (['th', 'st', 'nd', 'rd'][n % 100 > 10 && n % 100 < 14 ? 0 : n % 10] || 'th');
// "Build a landing page for Streakly, a habit-tracking app for busy parents. Save…" → "A landing page for Streakly, a habit-tracking app for busy parents"
const briefTitle = (t, b) => capFirst(t.briefs[b].split('. ')[0].replace(/^Build /, ''));
const testsFor = l => TESTS.filter(t => t.contestants.some(c => c.listing === l.id));
// On a listing's page: where it placed, against plain Claude, with a link to the test
function testedBox(l) {
  return testsFor(l).map(t => {
    const c = t.contestants.find(c => c.listing === l.id).id, rank = ranking(t).indexOf(c) + 1, w = winsOf(t, c), pick = t.verdict.pick === c, skip = (t.verdict.skip || []).includes(c);
    return `<a class="tested-box${pick ? ' pick' : skip ? ' skip' : ''}" href="#test-${t.id}"><span class="lbl">Tested ${fmtDate(t.date)}</span>
      <b>${pick ? `Our pick: best of ${t.contestants.length}` : `${ordinal(rank)} of ${t.contestants.length}`} in "${esc(t.title)}"</b>
      <span>Scored ${avgOf(t, c).toFixed(1)} out of 10 in blind judging; plain Claude scored ${avgOf(t, 'none').toFixed(1)}.${w ? ` Picked best in ${w} of ${roundsOf(t)} rounds.` : ''}${skip ? ' Its page broke on phones in one of the two tasks.' : ''}</span>
      <span class="tb-link">See the pages side by side</span></a>`; }).join('');
}
// Today's lead: the newest test, with the winner's page as the picture

function pageTest(id) {

    <section class="shelf"><div class="shelf-head"><h2>Scores<span class="sub">Blind judging, out of 10: looks designed, clarity, fit, polish and phone, averaged over ${t.judge.rounds} rounds</span></h2></div>
      <div class="cmp-wrap"><table class="cmp score-table"><thead><tr><th>Skill</th>${briefs.map(b => `<th>${esc(briefTitle(t, b).split(',')[0].replace(/^A (landing page|homepage) for /, ''))}</th>`).join('')}<th>Picked best</th><th>Our safety check</th></tr></thead>
      <tbody>${order.map(c => { const l = cListing(t, c);
        return `<tr class="${c === pick ? 'win' : ''}"><td>${l ? `<a href="#${l.id}">${esc(cOf(t, c).name)}</a><small>${esc(repoOf(l).on)}</small>` : `<b>${esc(cOf(t, c).name)}</b><small>No skill installed</small>`}</td>
          ${briefs.map(b => `<td class="sc-cell">${scoreBar(scoreOf(t, b, c).total)}</td>`).join('')}<td>${winsOf(t, c)} of ${roundsOf(t)}</td><td>${l ? `<span class="${trust(l).cls}">${trust(l).short}</span>` : '—'}</td></tr>`; }).join('')}</tbody></table></div></section>
    ${briefs.map(b => `<section class="shelf"><div class="shelf-head"><h2>${esc(briefTitle(t, b))}<span class="sub">Everyone got the same request: “${esc(t.briefs[b])}”</span></h2></div>

// ---------- What we caught ----------
// Every note a review wrote on a listing: risks first, then by stars. Things the code does that a README doesn't lead with.
const LV_RANK = { bad: 0, warn: 1, note: 2 };
const caughtAll = () => vis(L).flatMap(l => NT(l).map(n => ({ l, n }))).sort((a, b) => LV_RANK[a.n.lv] - LV_RANK[b.n.lv] || repoOf(b.l).st - repoOf(a.l).st);
const lowFirst = t => t.charAt(0).toLowerCase() + t.slice(1);
const caughtRow = ({ l, n }) => `<a class="caught-row" href="#${l.id}">${icon(l, 48)}<span class="ct"><b>${esc(l.n)}: ${esc(lowFirst(n.t))}</b><span>${esc(plainOf(l))}</span></span><span class="chip ${NT_LV[n.lv][1]}">${NT_LV[n.lv][2]}</span></a>`;
function caughtHero() {
  const top = caughtAll()[0];
  if (!top) return '';
  const { l, n } = top;
  return `<div class="today"><a class="story wide caught-hero" href="#${l.id}">${art(['#7C2D12', '#EA580C'], 'shieldq')}
    <div class="copy"><span class="eyebrow">What we caught</span><span class="title">${esc(l.n)}: ${esc(lowFirst(n.t))}</span></div>
    <div class="bottom frost">${icon(l, 48)}<div class="t"><b>${esc(l.n)}</b><span>${esc(n.n.length > 150 ? n.n.slice(0, 149).replace(/\s+\S*$/, '') + '…' : n.n)}</span></div><span class="get light">READ</span></div></a></div>`;
}
const testedLine = t => `<a class="tested-line" href="#test-${t.id}">${ic('check', 2)}<span><b>Tested:</b> ${esc(t.title)}. ${esc(cOf(t, t.verdict.pick).name)} won ${winsOf(t, t.verdict.pick)} of ${roundsOf(t)} blind rounds.</span></a>`;
function pageCaught() {
  const all = caughtAll(), risks = all.filter(x => x.n.lv !== 'note'), notes = all.filter(x => x.n.lv === 'note');
  const block = x => `<div class="caught-item">${caughtRow(x)}<p>${esc(x.n.n)}</p></div>`;
  return `<div class="page"><div class="large-title"><h1>Risks &amp; findings</h1><p>We read every listing's code. ${risks.length} of ${L.length} listings have a serious security problem; they come first, in plain words. The other findings are worth knowing but not dangerous, like usage data sent by default. Anything not on this page came up clean.</p></div>
    ${risks.length ? `<section class="shelf"><div class="shelf-head"><h2>Serious risks<span class="sub">Real security problems. Read these before installing</span></h2></div>${risks.map(block).join('')}</section>` : ''}
    ${notes.length ? `<section class="shelf"><div class="shelf-head"><h2>Worth knowing<span class="sub">Data it sends, keys it needs, things it changes</span></h2></div>${notes.map(block).join('')}</section>` : ''}
    ${hiddenNote(L.flatMap(l => NT(l)), all)}${dataNote()}</div>`;

// Each page visit gets an id in its history entry. Going back to a page restores where you were on it; a new visit starts at the top.
const POS = {};
const stamp = () => { if (!history.state?.nav) history.replaceState({ ...(history.state || {}), nav: Date.now().toString(36) + Math.random().toString(36).slice(2, 6) }, ''); return history.state.nav; };
let curNav = stamp(), prevHash = null;
// The phone's floating button gets out of the way while you scroll down, and comes back when you scroll up
{ let lastY = scrollY; addEventListener('scroll', () => { const y = scrollY, f = document.getElementById('fab'); if (Math.abs(y - lastY) < 8) return; f.classList.toggle('hide', (y > lastY && y > 120) || onTodayTop()); lastY = y; }, { passive: true }); }
// Today has its own Make it yours link at the top, so the floating one waits until that's scrolled away
function onTodayTop() { return S.tab === 'today' && !S.detail && scrollY < 260; }
window.addEventListener('hashchange', e => {
  POS[curNav] = window.scrollY;
  prevHash = decodeURIComponent(new URL(e.oldURL).hash.slice(1));
  const seen = history.state?.nav;
  route();
  window.scrollTo(0, seen && POS[seen] != null ? POS[seen] : 0);
  curNav = stamp();
});
// A Back link to the page you just came from goes back in history, so the browser's Back button doesn't bounce you forward again
document.addEventListener('click', e => {
  const a = e.target.closest('a.back');
  if (a && prevHash != null && a.getAttribute('href') === '#' + prevHash) { e.preventDefault(); history.back(); }
});
